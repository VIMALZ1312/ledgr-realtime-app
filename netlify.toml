[build]
  publish = "."
  # The on-demand sync pushes data.json to this repo on every run, and the
  # dashboard reads that file straight from GitHub raw — so a site rebuild
  # publishes nothing new and just burns 15 Netlify credits per deploy.
  # exit 0 = skip the build, exit 1 = build. Only data commits are skipped;
  # any real code change builds normally.
  ignore = "git log -1 --pretty=%s | grep -q '^Auto-sync (netlify)'"

# Only deploy from main branch — no deploy previews for PRs
[context.production]
  publish = "."

# Disable branch deploys and deploy previews entirely
[context.branch-deploy]
  command = "echo skip"

[context.deploy-preview]
  command = "echo skip"

# ── Serverless Plaid backend (replaces Replit) ───────────────────────────────
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Automatic sync, twice a day at 06:00 and 18:00 ET. The on-open pull in
# index.html only fires when someone actually opens the dashboard, so without a
# cron data.json goes stale through any stretch of not looking; the Sync button
# stays available for an immediate pull.
#
# The old "0 */6 * * *" cron was removed because each run's data commit
# triggered a paid production deploy. That cost is gone: data commits now carry
# [skip ci] and match the `ignore` command above, so these runs cost function
# invocations and Plaid calls only. Four times a day was more than the data
# changes; twice is plenty. Edit this one line to change the cadence.
[functions."sync-scheduled"]
  schedule = "0 11,23 * * *"   # UTC

# Friendly /api/* paths proxy to the functions so the frontend can use
# same-origin relative URLs (no CORS, no Replit hostname).
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync-background"
  status = 200

[[redirects]]
  from = "/api/create-link-token"
  to = "/.netlify/functions/create-link-token"
  status = 200

[[redirects]]
  from = "/api/exchange-token"
  to = "/.netlify/functions/exchange-token"
  status = 200

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/hide"
  to = "/.netlify/functions/hide"
  status = 200
