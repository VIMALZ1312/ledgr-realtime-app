function classifySub(desc) {
  var d = (desc || '').trim();
  for (var i = 0; i < SUB_RULES.length; i++) {
    if (SUB_RULES[i][0].test(d)) return {name:SUB_RULES[i][1], type:SUB_RULES[i][2], group:SUB_RULES[i][3]};
  }
  return null;
}

function median(arr) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function(a,b){ return a-b; });
  var m = Math.floor(s.length/2);
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
}

function renderSubscriptions() {
  var ms = D.monthly_spending || {};
  var periods = Object.keys(ms).sort();
  var totalMonths = periods.length;

  // Bucket matching transactions (positive charges only) by canonical name → per-period totals
  var buckets = {};
  periods.forEach(function(p) {
    (ms[p].transactions || []).forEach(function(t) {
      if (!t || t.amount <= 0) return;                 // skip refunds / credits
      if (EXCLUDED && EXCLUDED[t.desc]) return;        // respect hide list
      var c = classifySub(t.desc);
      if (!c) return;
      var b = buckets[c.name] || (buckets[c.name] = {name:c.name, type:c.type, group:c.group, byPeriod:{}, cat:t.category, lastDate:'', lastPeriod:''});
      b.byPeriod[p] = (b.byPeriod[p] || 0) + t.amount;
      if (p > b.lastPeriod || (p === b.lastPeriod && (t.date||'') > b.lastDate)) { b.lastPeriod = p; b.lastDate = t.date || ''; }
    });
  });

  // Summarise each bucket; require it to recur across >=2 distinct months
  var subs = [], bills = [];
  Object.values(buckets).forEach(function(b) {
    var pers = Object.keys(b.byPeriod).sort();
    if (pers.length < 2) return;                       // not yet recurring
    var totals = pers.map(function(p){ return b.byPeriod[p]; });
    var med = median(totals);
    var mn = Math.min.apply(null, totals), mx = Math.max.apply(null, totals);
    b.monthly = med;
    b.variable = med > 0 && (mx - mn) / med > 0.15;
    b.monthsSeen = pers.length;
    b.periods = pers;
    (b.group === 'bill' ? bills : subs).push(b);
  });
  subs.sort(function(a,b){ return b.monthly - a.monthly; });
  bills.sort(function(a,b){ return b.monthly - a.monthly; });

  // ── Other recurring — auto-detect fixed-amount charges NOT in the curated rules
  // (e.g. HOA, tolls auto-reload, installment plans) so nothing recurring is missed.
  var otherBuckets = {};
  periods.forEach(function(p) {
    (ms[p].transactions || []).forEach(function(t) {
      if (!t || t.amount <= 0) return;
      if (EXCLUDED && EXCLUDED[t.desc]) return;
      if (classifySub(t.desc)) return;                              // already curated above
      if (/zelle|payment to|transfer|refund/i.test(t.desc || '')) return; // not a subscription
      var b = otherBuckets[t.desc] || (otherBuckets[t.desc] = {name:t.desc, byPeriod:{}, ch:[], cat:t.category, lastDate:'', lastPeriod:''});
      var amt = Math.round(t.amount * 100) / 100;
      b.byPeriod[p] = (b.byPeriod[p] || 0) + t.amount;
      b.ch.push({p:p, a:amt});
      if (p > b.lastPeriod || (p === b.lastPeriod && (t.date||'') > b.lastDate)) { b.lastPeriod = p; b.lastDate = t.date || ''; }
    });
  });
  var other = [];
  Object.values(otherBuckets).forEach(function(b) {
    var cnt = {};
    b.ch.forEach(function(c){ cnt[c.a] = (cnt[c.a] || 0) + 1; });
    var modal = null, mc = 0;
    Object.keys(cnt).forEach(function(a){ if (cnt[a] > mc) { mc = cnt[a]; modal = parseFloat(a); } });
    var modalMonths = new Set(b.ch.filter(function(c){ return c.a === modal; }).map(function(c){ return c.p; })).size;
    if (modalMonths < 2 || mc / b.ch.length < 0.5) return;          // must recur, and mostly at one price
    b.monthly = modal;
    b.type = b.cat || 'Recurring';
    b.group = 'other';
    b.periods = Object.keys(b.byPeriod).sort();
    b.monthsSeen = b.periods.length;
    b.variable = b.periods.some(function(p){ return Math.abs(b.byPeriod[p] - modal) > 0.01; });
    other.push(b);
  });
  other.sort(function(a,b){ return b.monthly - a.monthly; });

  var subMonthly   = subs.reduce(function(s,b){ return s + b.monthly; }, 0);
  var billMonthly  = bills.reduce(function(s,b){ return s + b.monthly; }, 0);
  var otherMonthly = other.reduce(function(s,b){ return s + b.monthly; }, 0);
  var recurMonthly = subMonthly + otherMonthly;          // everything except utility bills
  var recurCount   = subs.length + other.length;

  var html = '';
  html += '<div class="kpi-row">';
  html += mkKpi('SUBSCRIPTIONS', fmt2(recurMonthly), 'var(--purple)', 'per month', "switchTab('subs')");
  html += mkKpi('ANNUAL', fmt(recurMonthly * 12), 'var(--red)', 'projected /yr', "switchTab('subs')");
  html += mkKpi('ACTIVE', String(recurCount), 'var(--blue)', 'recurring services', "switchTab('subs')");
  html += '</div>';

  function bucketRows(list, accent) {
    var out = '';
    list.forEach(function(b) {
      var col = CAT_COLORS[b.cat] || accent;
      var rid = uid();
      var last = b.lastDate ? (ms[b.lastPeriod] ? short(ms[b.lastPeriod].label).replace(/ .*/, '') : '') + ' ' + b.lastDate : '';
      out += '<div class="row expandable" onclick="expand(\'' + rid + '\')">';
      out += '<div><div class="row-label" style="font-weight:500">' + b.name + '</div>';
      out += '<div class="row-sub" style="color:' + col + '">' + b.type + ' · ' + b.monthsSeen + '/' + totalMonths + ' mo'
           + (b.lastDate ? ' · last ' + b.lastDate : '') + '</div></div>';
      out += '<div style="display:flex;align-items:center;gap:8px"><div style="text-align:right">'
           + '<div class="row-amt" style="color:' + accent + '">' + (b.variable ? '~' : '') + fmt2(b.monthly)
           + '<span style="font-size:10px;color:var(--muted)">/mo</span></div>'
           + '<div style="font-size:10px;color:var(--muted)">' + fmt(b.monthly * 12) + '/yr</div></div>'
           + '<span style="color:var(--muted)">&rsaquo;</span></div></div>';
      out += '<div id="' + rid + '" class="expand-body">';
      b.periods.slice().reverse().forEach(function(p) {
        out += '<div style="display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--border2);font-size:12px">';
        out += '<span style="flex:1;color:var(--muted)">' + short((ms[p]||{}).label || p) + '</span>';
        out += '<span style="font-family:IBM Plex Mono,monospace;color:' + accent + '">' + fmt2(b.byPeriod[p]) + '</span></div>';
      });
      out += '<div style="font-size:10px;color:var(--muted);padding:6px 0 2px">'
           + (b.variable ? 'Amount varies month to month — median shown. ' : '')
           + '~' + fmt2(b.monthly) + '/mo · ~' + fmt(b.monthly * 12) + '/yr</div>';
      out += '</div><div style="height:1px;background:var(--border);margin:4px 0"></div>';
    });
    return out;
  }

  // Subscriptions panel
  html += '<div class="panel"><div class="panel-head"><div class="panel-title">Subscriptions</div>';
  html += '<div class="panel-action" style="color:var(--purple)">' + fmt2(subMonthly) + '/mo · ' + fmt(subMonthly * 12) + '/yr</div></div>';
  if (!subs.length) {
    html += '<div style="color:var(--muted);font-size:13px;padding:8px 0">No subscriptions detected yet — needs at least two months of data.</div>';
  } else {
    html += '<div style="font-size:10px;color:var(--muted);padding:0 0 6px">Auto-detected recurring services seen in 2+ months. Tap any row for its charge history.</div>';
    html += bucketRows(subs, 'var(--purple)');
  }
  html += '</div>';

  // Bills & utilities panel
  html += '<div class="panel"><div class="panel-head"><div class="panel-title">Bills &amp; Utilities</div>';
  html += '<div class="panel-action" style="color:var(--orange)">' + fmt2(billMonthly) + '/mo est.</div></div>';
  if (!bills.length) {
    html += '<div style="color:var(--muted);font-size:13px;padding:8px 0">No recurring utility bills detected.</div>';
  } else {
    html += '<div style="font-size:10px;color:var(--muted);padding:0 0 6px">Recurring household bills — usually variable. Median monthly shown.</div>';
    html += bucketRows(bills, 'var(--orange)');
  }
  html += '</div>';

  // Other recurring panel — only show when something was detected
  if (other.length) {
    html += '<div class="panel"><div class="panel-head"><div class="panel-title">Other Recurring</div>';
    html += '<div class="panel-action" style="color:var(--yellow)">' + fmt2(otherMonthly) + '/mo est.</div></div>';
    html += '<div style="font-size:10px;color:var(--muted);padding:0 0 6px">Fixed-amount charges that repeat monthly but aren’t in the known-service list — e.g. HOA, tolls, installment plans. Tap ✕ on a charge to dismiss a false match.</div>';
    html += bucketRows(other, 'var(--yellow)');
    html += '</div>';
  }

  set('main-content', html);
}

function renderZelle() {
  var ms = D.monthly_spending || {};
  var periods = Object.keys(ms).sort();
  var html = '';

  // Zelle by name by month
  var rawZ = D.zelle_received || [];
  var byName = {};
  rawZ.forEach(function(z) {
    var name = cleanZelleName(z.from);
    if(name.toLowerCase().indexOf('vimal') >= 0) return;
    if(/^TD\s+RECEIVED/i.test(name)) return;
    if(!byName[name]) byName[name] = {total:0, months:{}};
    byName[name].total += z.amount;
    var p = z.period || '';
    if(!byName[name].months[p]) byName[name].months[p] = {label:z.period_label||p, total:0};
    byName[name].months[p].total += z.amount;
  });

  var zelleNames = Object.keys(byName).sort(function(a,b){ return byName[b].total-byName[a].total; });
  var zelleTotal = zelleNames.reduce(function(s,n){ return s+byName[n].total; }, 0);

  allP.sort();

  html += '<div class="panel"><div class="panel-head"><div class="panel-title">Zelle Received</div><div class="panel-action" style="color:var(--green)">' + fmt2(zelleTotal) + ' total</div></div>';

    });
    html += '<th style="text-align:right;padding:6px 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);font-weight:500">Total</th></tr></thead><tbody>';

        html += '<td style="padding:8px;border-bottom:1px solid var(--border2);text-align:right;font-family:IBM Plex Mono,monospace">';
        html += mv ? '<span style="color:var(--green)">' + fmt2(mv.total) + '</span>' : '<span style="color:var(--muted2)">-</span>';
        html += '</td>';
      });
      html += '<td style="padding:8px;border-bottom:1px solid var(--border2);text-align:right;font-family:IBM Plex Mono,monospace;font-weight:600;color:var(--green)">' + fmt2(nv.total) + '</td></tr>';
    });
    var totRow = '<tr style="background:var(--s2)"><td style="padding:8px;font-weight:600;font-size:12px">Total</td>';
    allP.forEach(function(p) {
      var pt = zelleNames.reduce(function(s,n){ return s + (byName[n].months[p] ? byName[n].months[p].total : 0); }, 0);
      totRow += '<td style="padding:8px;text-align:right;font-family:IBM Plex Mono,monospace;font-weight:600;color:var(--green)">' + (pt ? fmt2(pt) : '-') + '</td>';

// There is no scheduled sync any more: Plaid is pulled here and nowhere else.
// `auto` is the on-open pull (quiet, no alert on failure — the stale data on
// screen is still usable); the Sync button calls this with auto=false.
var SYNC_IN_FLIGHT = false;
function triggerSync(auto) {
  if(SYNC_IN_FLIGHT) return;
  SYNC_IN_FLIGHT = true;
  var b = $('sync-btn'), bt = $('sync-btn-top');
  var before = (D && D.generated_at) || '';
  function setBusy(on, label) {
    if(b) { b.textContent = on ? (label || 'Syncing…') : 'Sync'; b.disabled = on; }
    if(bt) { bt.innerHTML = on ? '&#8987;' : '&#9889;'; bt.disabled = on; }
  }
  setBusy(true, auto ? 'Refreshing…' : 'Syncing…');
  // /api/sync proxies to the Netlify background function — returns 202 and runs
  // async, forcing a live Plaid pull (/transactions/refresh + live balances),
  // then pushes a fresh data.json to GitHub. Reset the button quickly (snappy,
  // like before) and quietly swap in the new data when it lands.
  var syncedEl = $('synced-at');
  fetch(BACKEND + '/api/sync', { method: 'POST', cache: 'no-store' })
    .then(function(r) {
      if(r.status !== 202 && !r.ok) throw new Error('HTTP ' + r.status);
      setTimeout(function(){ setBusy(false); }, 2000); // free the button right away
      if(syncedEl) syncedEl.textContent = 'Pulling from banks… (~1–2 min)';
      // Poll for a data.json whose generated_at differs from the copy on screen.
      // fetchData() reads /api/data, which reflects a finished sync within a
      // second or two. Polling raw.githubusercontent here is what made the Sync
      // button look broken: that CDN sends max-age=300, so a sync that finished
      // in 25 seconds stayed invisible for up to five minutes, this poll gave up
      // before it appeared, and the numbers only changed if you came back later.
      var tries = 0, max = 24; // 10s then every 15s ≈ 6 min safety
      function check() {
        tries++;
        fetchData()
          .then(function(nd) {
            if(nd.generated_at && nd.generated_at !== before) { clearInterval(iv); SYNC_IN_FLIGHT = false; loadData(); }
            else if(tries >= max) { clearInterval(iv); SYNC_IN_FLIGHT = false; if(syncedEl) syncedEl.textContent = 'Sync still running — reload soon'; }
          })
          .catch(function(){ if(tries >= max) { clearInterval(iv); SYNC_IN_FLIGHT = false; } });
      }
      setTimeout(check, 6000);
      var iv = setInterval(check, 6000);
    })
    .catch(function(e){
      SYNC_IN_FLIGHT = false; setBusy(false);
      if(auto) { if(syncedEl) syncedEl.textContent = 'Auto-refresh failed — tap Sync'; }
      else alert('Cannot reach sync function: ' + e.message);
    });
}

function deduplicateData(data) {
  if(!data || !data.monthly_spending) return data;
  Object.keys(data.monthly_spending).forEach(function(p) {
    var v = data.monthly_spending[p];
    // Step 1: Deduplicate by date+desc+amount
    var seen = {};
    var deduped = [];
    (v.transactions || []).forEach(function(t) {
      var key = t.date + '|' + t.desc + '|' + t.amount;
      if(!seen[key]) { seen[key] = true; deduped.push(t); }
    });
    // Step 1b: Rename legacy categories
  var CAT_RENAMES = {'Tech/Subs':'Subscription'};
  deduped.forEach(function(t) {
    if(CAT_RENAMES[t.category]) t.category = CAT_RENAMES[t.category];
  });

 // Step 2: Auto-match refund pairs (negative + same merchant, within 2 cents)
    var nullified = {};
    deduped.filter(function(t){return t.amount<0;}).forEach(function(refund) {
      var targetAmt = Math.abs(refund.amount);
      var match = deduped.find(function(p) {
        return p.amount > 0
          && Math.abs(p.amount - targetAmt) < 0.02
          && p.desc === refund.desc
          && !nullified[p.date+'|'+p.desc+'|'+p.amount];
      });
      if(match) {
        nullified[match.date+'|'+match.desc+'|'+match.amount] = true;
        nullified[refund.date+'|'+refund.desc+'|'+refund.amount] = true;
        match.refund_matched = true;
        refund.refund_matched = true;
      } else {
        refund.unmatched_refund = true;
      }
    });
    // Step 3: Filter EXCLUDED; keep refund pairs visible
    var final = deduped.filter(function(t) {
      if(EXCLUDED && EXCLUDED[t.desc]) return false;
      return true;
    });
    // Step 4: Recalculate
    v.transactions = final;
    v.categories = {};
    v.total = 0;
    final.forEach(function(t) {
      if(t.amount > 0) { // only count purchases in totals
        v.categories[t.category] = (v.categories[t.category] || 0) + t.amount;
        v.total += t.amount;
      }
    });
  });
  return data;
}

function migrateOldOverrides() {
  // Migrate old keys that were "desc|amount" format to just "desc"
  var migrated = false;
  Object.keys(CAT_OVERRIDES).forEach(function(key) {
    if(key.indexOf('|') >= 0) {
      var desc = key.substring(0, key.lastIndexOf('|'));
      if(!CAT_OVERRIDES[desc]) {
        CAT_OVERRIDES[desc] = CAT_OVERRIDES[key];
        migrated = true;
      }
      delete CAT_OVERRIDES[key];
      migrated = true;
    }
  });
  if(migrated) saveOverrides();
}
migrateOldOverrides();

// ── Search: every money-in and money-out transaction of the last year ──
// Source is D.cashflow (tx_in / tx_out / tx_moved), so incoming money such as
// an insurance payout is searchable too, not only spending. Each row can be
// deleted: the backend hides it for good (Blobs) and rebuilds data.json, so it
// drops out of every tab and never returns on a later sync.
function searchIndex(){
  var out = [];
  var cf = (D && D.cashflow) || {};
  Object.keys(cf).forEach(function(p){
    var y = p.slice(0,4), m = cf[p];
    [['tx_in','in'],['tx_out','out'],['tx_moved','moved']].forEach(function(pair){
      (m[pair[0]]||[]).forEach(function(x){
        if(!x.id) return; // e.g. a bounce reversal line, not a bank row
        out.push({ id:x.id, period:p, date:y+'-'+x.d, d:x.d, name:x.n, amt:x.a, group:x.g, bank:x.b||'', mask:x.k||'', dir:pair[1] });
      });
    });
  });
  return out;
}
var _srchDir = 'all';
function renderSearch() {
  var html = '<div class="panel">';
  html += '<div class="panel-head"><div class="panel-title">Transaction Search</div><div class="panel-action">last 12 months</div></div>';
  html += '<input id="srch-input" type="search" placeholder="Search: insurance, amazon, kumon, 6135…" autocomplete="off" class="srch-input" oninput="runSearch()">';
  html += '<div class="seg" style="margin-top:10px">';
  [['all','All'],['out','Money out'],['in','Money in']].forEach(function(o){
    html += '<button class="seg-btn'+(_srchDir===o[0]?' on':'')+'" onclick="_srchDir=\''+o[0]+'\';renderSearch();runSearch()">'+o[1]+'</button>';
  });
  html += '</div>';
  html += '<div style="font-size:11px;color:var(--muted);margin-top:10px">Searches names, categories, amounts and banks. Tap 🗑 to delete a transaction everywhere — it stays deleted after every sync.</div>';
  html += '</div>';
  html += '<div id="srch-results"></div>';
  html += renderHiddenList();
  set('main-content', html);
  setTimeout(function(){ var el=$('srch-input'); if(el){ el.value = window._srchQ || ''; el.focus(); if(el.value) runSearch(); } }, 60);
}

function runSearch() {
  var inp = $('srch-input'); var el = $('srch-results');
  if(!inp || !el) return;
  var q = window._srchQ = inp.value;
  var words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length){ el.innerHTML = ''; return; }
  var rows = searchIndex().filter(function(r){
    if(_srchDir !== 'all' && !(r.dir === _srchDir || (_srchDir === 'out' && r.dir === 'moved'))) return false;
    var hay = (r.name+' '+r.group+' '+r.bank+' '+r.mask+' '+Math.abs(r.amt).toFixed(2)+' '+r.date).toLowerCase();
    return words.every(function(w){ return hay.indexOf(w) >= 0; });
  }).sort(function(a,b){ return b.date.localeCompare(a.date); });

  if(!rows.length){ el.innerHTML = '<div class="panel" style="color:var(--muted);font-size:13px">No transactions match “'+esc(q)+'”.</div>'; return; }

  var html = '<div class="panel"><div class="panel-head"><div class="panel-title">'+rows.length+' result'+(rows.length>1?'s':'')+'</div></div>';
  var lastP = '';
  rows.slice(0, 300).forEach(function(r){
    if(r.period !== lastP){
      lastP = r.period;
      html += '<div class="srch-month">'+new Date(r.period+'-15T00:00:00').toLocaleString('en-US',{month:'long',year:'numeric'})+'</div>';
    }
    html += srchRow(r);
  });
  if(rows.length > 300) html += '<div style="font-size:11px;color:var(--muted);margin-top:8px">Showing the newest 300 — type more to narrow down.</div>';
  html += '</div>';
  el.innerHTML = html;
}
function srchRow(r){
  var isIn = r.dir === 'in', credit = r.amt < 0;
  var sign = isIn ? '+' : (credit ? '−' : '');
  var col = isIn || credit ? 'var(--green)' : 'var(--text)';
  var tag = r.dir === 'moved' ? 'not spending' : (isIn ? 'money in' : r.group);
  return '<div class="txn" id="row-'+esc(r.id)+'">'
    + '<div class="txn-date">'+esc(r.d)+'</div>'
    + '<div class="txn-main"><div class="txn-name">'+esc(cleanDesc(r.name))+'</div>'
    + '<div class="txn-meta"><span class="pill">'+esc(tag)+'</span>'+(r.bank ? ' '+esc(r.bank)+(r.mask?' ••'+esc(r.mask):'') : '')+'</div></div>'
    + '<div class="txn-amt" style="color:'+col+'">'+sign+fmt2(Math.abs(r.amt))+'</div>'
    + '<button class="txn-del" title="Delete everywhere" onclick="deleteTxn(\''+esc(r.id)+'\', this)">🗑</button>'
    + '</div>';
}
function renderHiddenList(){
  var h = ((D && D.hidden) || []).slice().sort(function(a,b){ return (b.hidden_at||'').localeCompare(a.hidden_at||''); });
  if(!h.length) return '';
  var html = '<div class="panel"><div class="panel-head"><div class="panel-title">Deleted transactions</div><div class="panel-action">'+h.length+'</div></div>';
  h.forEach(function(x){
    var amt = Number(x.amount)||0; // Plaid sign: negative = money in
    html += '<div class="txn" style="opacity:.7">'
      + '<div class="txn-date">'+esc((x.date||'').slice(5))+'</div>'
      + '<div class="txn-main"><div class="txn-name" style="text-decoration:line-through">'+esc(cleanDesc(x.desc))+'</div>'
      + '<div class="txn-meta">'+esc(x.bank||'')+(x.mask?' ••'+esc(x.mask):'')+' · '+esc((x.date||'').slice(0,4))+'</div></div>'
      + '<div class="txn-amt">'+(amt<0?'+':'')+fmt2(Math.abs(amt))+'</div>'
      + '<button class="txn-restore" onclick="restoreTxn(\''+esc(x.id)+'\', this)">Restore</button></div>';
  });
  html += '<div style="font-size:11px;color:var(--muted);margin-top:8px">Deleted transactions are left out of every tab, total and insight.</div></div>';
  return html;
}
function setHiddenRemote(id, hide){
  return fetch(BACKEND + '/api/hide', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id:id, hide:hide }) })
    .then(function(r){ return r.json().then(function(j){ if(!r.ok || !j.ok) throw new Error(j.error || ('HTTP '+r.status)); return j; }); });
}
function deleteTxn(id, btn, label){
  var row = $('row-'+id);
  var name = label || (row ? (row.querySelector('.txn-name')||{}).textContent : 'this transaction');
  if(!confirm('Delete “'+name+'” everywhere?\n\nIt will be left out of every tab and total, and stay deleted after syncing. You can restore it from Search later.')) return;
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  if(row) row.style.opacity = '.4';
  setHiddenRemote(id, true)
    .then(function(j){ $('modal').classList.remove('open'); toast('Deleted — every tab updated'); if(j.data) applyData(j.data); else loadData(); })
    .catch(function(e){ if(row) row.style.opacity = ''; if(btn){ btn.disabled = false; btn.textContent = '🗑'; } alert('Could not delete: ' + e.message); });
}
function restoreTxn(id, btn){
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  setHiddenRemote(id, false)
    .then(function(j){ toast('Restored'); if(j.data) applyData(j.data); else loadData(); })
    .catch(function(e){ if(btn){ btn.disabled = false; btn.textContent = 'Restore'; } alert('Could not restore: ' + e.message); });
}
function toast(msg){
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.classList.add('show'); }, 10);
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 300); }, 2600);
}

function exportOverrides() {
  var keys = Object.keys(CAT_OVERRIDES);
  if(!keys.length) { alert('No category edits to export.'); return; }
  var data = JSON.stringify(CAT_OVERRIDES, null, 2);
  // Copy to clipboard
  navigator.clipboard.writeText(data).then(function() {
    alert('✅ ' + keys.length + ' category edits copied to clipboard!\n\nPaste this somewhere safe. To restore, use Settings → Import edits.');
  }).catch(function() {
    // Fallback: show in prompt
    prompt('Copy these category edits (Ctrl+A, Ctrl+C):', data);
  });
}

function importOverrides(json) {
  try {
    var parsed = JSON.parse(json || '{}');
    var count = Object.keys(parsed).length;
    if(!count) { alert('No edits found in that data.'); return; }
    Object.assign(CAT_OVERRIDES, parsed);
    saveOverrides();
    D = applyOverrides(JSON.parse(JSON.stringify(_rawD)));
    render();
    alert('✅ Imported ' + count + ' category edits!');
  } catch(e) { alert('Invalid format: ' + e.message); }
}


function showMs(idx) {
  var entry = window._ms && window._ms[idx];
  if(!entry || !entry.txns.length) {
    openModal('No transactions', '', '<div style="color:var(--muted);font-size:13px;padding:12px">Nothing here.</div>');
    return;
  }
  var total = entry.txns.reduce(function(s,t){return s+(t.amount||0);},0);
  var b = '<div style="font-family:IBM Plex Mono,monospace;font-size:18px;color:'+entry.col+';margin-bottom:12px">'+fmt2(total)+'</div>';
  entry.txns.forEach(function(t){ b += txnLine(t, entry.col, ''); });
  openModal(entry.title, entry.txns.length+' transactions', b);
}

function toggleExclude(desc) {
  var realDesc = desc.replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
  if(EXCLUDED[realDesc]) delete EXCLUDED[realDesc];
  else EXCLUDED[realDesc] = true;
  saveExcluded();
  D = applyOverrides(deduplicateData(JSON.parse(JSON.stringify(_rawD))));
  render();
}


// How stale the data may be before opening the app pulls from Plaid again.
// Without this, every reload (or PWA resume) would kick off a full bank pull.
// At 15 minutes a handful of visits meant a handful of full eight-bank pulls
// in a day, on top of the cron; six hours keeps opening the app cheap, and
// the Sync button is still there whenever an immediate pull is wanted.
var AUTO_SYNC_STALE_MIN = 360;

// Read data.json from somewhere that is actually current. /api/data is
// same-origin and no-store, and the function behind it serves Blobs or the
// GitHub contents API, both of which reflect a finished sync immediately.
// raw.githubusercontent.com is only the fallback for when that function is
// unreachable: it is CDN-cached with max-age=300, so on its own it can hand
// back a five-minute-old file and make a completed sync look like it failed.
var RAW_DATA_URL = 'https://raw.githubusercontent.com/VIMALZ1312/ledgr-realtime-app/main/data.json';
function fetchData() {
  return fetch('/api/data?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('/api/data HTTP ' + r.status); return r.json(); })
    .catch(function(){
      return fetch(RAW_DATA_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.json(); });
    });
}

// Show a data.json: from /api/data on load, or straight from /api/hide's reply.
function applyData(data) {
  // 1. Deduplicate first (fixes server-side duplication regardless of Replit version)
  data = deduplicateData(data);
  // 2. Store clean raw copy
  _rawD = JSON.parse(JSON.stringify(data));
  // 3. Apply category overrides on top
  D = applyOverrides(JSON.parse(JSON.stringify(_rawD)));
  buildNav();
  render();
  if(TAB === 'search') runSearch();
  if(data.generated_at) {
    var dt = new Date(data.generated_at);
    var el = $('synced-at');
    if(el) el.textContent = dt.toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  }
  return data;
}
function loadData(opts) {
  fetchData()
    .then(function(data) {
      data = applyData(data);
      // Opening the app is itself a request for current numbers: show the last
      // snapshot immediately, then pull from Plaid in the background if it's
      // older than AUTO_SYNC_STALE_MIN. (Only on the initial load — the reload
      // that follows a sync must not start another one.)
      if(opts && opts.autoSync) {
        var ageMin = data.generated_at ? (Date.now() - new Date(data.generated_at).getTime()) / 60000 : Infinity;
        if(ageMin > AUTO_SYNC_STALE_MIN) triggerSync(true);
      }
    })
    .catch(function(e){ set('main-content', '<div style="padding:20px;color:var(--red);font-size:13px">Failed to load data: ' + e + '</div>'); });
}

buildNav();
loadData({ autoSync: true });
fetchSavings(); // pull the Google-Sheet savings total so Net Worth includes it
</script>
