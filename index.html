<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LEDGR">
<meta name="theme-color" content="#060608">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LEDGR</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Pastel theme. Accents (--green, --red…) stay readable as text; the --p-*
   tints are the soft fills behind cards, pills and the active tab. */
[data-theme="dark"]{--bg:#14121d;--surface:#1b1928;--card:#201e2f;--s2:#29263b;--s3:#322e48;--border:rgba(200,190,255,0.10);--border2:rgba(200,190,255,0.06);--text:#efedf8;--muted:#a29dbd;--muted2:#5d5878;--modal-bg:rgba(8,6,16,0.72);--modal-card:#211f31;--green:#86e0bd;--red:#f6a3b7;--yellow:#f4d48f;--blue:#a5c3fa;--orange:#f7b98e;--purple:#c0b4fc;--accent:#c0b4fc;
  --track:rgba(255,255,255,0.10);--p-mint:rgba(134,224,189,0.13);--p-rose:rgba(246,163,183,0.13);--p-sky:rgba(165,195,250,0.13);--p-lav:rgba(192,180,252,0.15);--p-peach:rgba(247,185,142,0.13);--shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);--on-accent:#1b1928;}
[data-theme="light"]{--bg:#f6f4fb;--surface:#ffffff;--card:#ffffff;--s2:#f3f0fa;--s3:#e9e4f5;--border:rgba(84,64,150,0.10);--border2:rgba(84,64,150,0.06);--text:#272240;--muted:#7f799b;--muted2:#c4bfd8;--modal-bg:rgba(39,34,64,0.35);--modal-card:#ffffff;--green:#1f9d77;--red:#d6577a;--yellow:#b9862a;--blue:#4a7fe0;--orange:#d97b44;--purple:#7a68ee;--accent:#7a68ee;
  --track:#ffffff;--p-mint:#e2f6ee;--p-rose:#fde9ef;--p-sky:#e6eefd;--p-lav:#efebfe;--p-peach:#fdeee4;--shadow:0 1px 2px rgba(60,40,120,.05),0 6px 20px rgba(60,40,120,.06);--on-accent:#ffffff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.logo{padding:20px 18px 16px;border-bottom:1px solid var(--border);}
.logo-mark{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;letter-spacing:2px;}
.logo-mark span{color:var(--green);}
.logo-mark,.t-logo{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:3px;}
.dot{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:5px;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.nav{padding:10px 0;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;color:var(--muted);cursor:pointer;border-left:2px solid transparent;transition:all .12s;}
.nav-item:hover{color:var(--text);background:var(--s2);}
.nav-item.active{color:var(--text);border-left-color:var(--green);background:var(--s2);font-weight:500;}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--border);}
.btn-sync{width:100%;padding:9px;background:var(--green);color:#000;border:none;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:6px;}
.btn-sync:disabled{opacity:.5;}
.btn-sec{width:100%;padding:8px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;margin-bottom:4px;}
.synced-at{font-size:10px;color:var(--muted2);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
/* Re-link banner — sits above every tab when a bank stops syncing. */
#relink-banner{padding:8px 14px 0;}
.relink-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 40%,transparent);border-radius:6px;padding:9px 11px;margin-bottom:6px;}
.relink-txt{flex:1;min-width:170px;font-size:12px;line-height:1.45;}
.relink-sub{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;}
.relink-btn{flex:0 0 auto;background:var(--red);color:#fff;border:none;border-radius:5px;padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.relink-btn:active{opacity:.75;}
.topbar{display:none;position:sticky;top:0;z-index:200;height:52px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center;padding:0 14px;gap:10px;}
.t-logo{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;letter-spacing:2px;flex:1;}
.t-logo span{color:var(--green);}
.t-btn{background:var(--s2);border:1px solid var(--border);border-radius:18px;padding:5px 11px;font-size:14px;cursor:pointer;color:var(--text);}
.hamburger{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;}
.bottom-tabs{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--surface);border-top:1px solid var(--border);padding:6px 0;}
.btabs{display:flex;}
.btab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:10px;color:var(--muted);cursor:pointer;border:none;background:none;}
.btab.active{color:var(--green);}
.btab-icon{font-size:18px;}
.overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.6);}
.overlay.open{display:block;}
.drawer{position:fixed;top:0;left:-100%;bottom:0;z-index:400;width:220px;background:var(--surface);border-right:1px solid var(--border);transition:left .2s;overflow-y:auto;display:flex;flex-direction:column;}
.drawer.open{left:0;}
.drawer-x{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:14px 16px;text-align:right;display:block;width:100%;}
.main{flex:1;min-width:0;padding:20px 24px 80px;}
.modal-bg{display:none;position:fixed;inset:0;z-index:500;background:var(--modal-bg);backdrop-filter:blur(4px);}
.modal-bg.open{display:flex;align-items:flex-end;justify-content:center;}
.modal-card{background:var(--modal-card);border-radius:18px 18px 0 0;width:100%;max-width:540px;padding:20px;max-height:82vh;overflow-y:auto;position:relative;}
.modal-x{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:3px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:14px;font-family:'IBM Plex Mono',monospace;}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.panel-title{font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.panel-action{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;}
.kpi:hover{background:var(--s2);}
.kpi-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.kpi-val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;line-height:1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:5px;}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border2);}
.row:last-child{border-bottom:none;}
.row-label{font-size:13px;}
.row-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.row-amt{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;}
.expandable{cursor:pointer;}
.expandable:hover{background:var(--s2);margin:0 -4px;padding-left:4px;padding-right:4px;border-radius:6px;}
.expand-body{display:none;border-top:1px solid var(--border2);margin-top:4px;padding-top:4px;}
.expand-body.open{display:block;}
.cat-bar-row{display:flex;align-items:center;gap:10px;padding:6px 0;}
.cat-bar-label{font-size:13px;width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-bar-track{flex:1;height:6px;background:var(--s3);border-radius:3px;overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:3px;}
.cat-bar-amt{font-family:'IBM Plex Mono',monospace;font-size:12px;width:66px;text-align:right;flex-shrink:0;}
.chart-wrap{position:relative;height:200px;margin-bottom:4px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;background:var(--s2);border:1px solid var(--border);margin:3px;}
.edit-btn{font-size:11px;color:var(--muted2);cursor:pointer;flex-shrink:0;padding:0 2px;background:none;border:none;}
.edit-btn:hover{color:var(--muted);}
.edited-badge{font-size:10px;color:var(--yellow);margin-left:4px;}
.state-block{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.state-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
.state-head:hover{background:var(--s2);}
.state-badge{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--yellow);background:rgba(245,197,24,0.10);border:1px solid rgba(245,197,24,0.25);padding:5px 9px;border-radius:6px;flex-shrink:0;letter-spacing:0.5px;min-width:38px;text-align:center;}
.state-name{flex:1;min-width:0;}
.state-name-main{font-size:14px;font-weight:500;}
.state-name-sub{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.state-total{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:500;color:var(--yellow);flex-shrink:0;}
.state-chev{color:var(--muted);font-size:14px;flex-shrink:0;margin-left:2px;}
.state-body{padding:0 14px 12px 14px;}
.travel-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.travel-chips .chip{margin:0;}

/* ── Pastel polish ─────────────────────────────────────────────────────── */
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased;}
/* Numbers: the app sets IBM Plex Mono inline in many places; render them in
   the UI face with even-width digits so columns still line up. */
[style*="IBM Plex Mono"],.kpi-val,.row-amt,.cat-bar-amt,.state-total{font-family:'Plus Jakarta Sans',system-ui,sans-serif !important;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.logo-mark,.t-logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;letter-spacing:1px;}
.logo-mark span,.t-logo span{color:var(--purple);}
.dot{background:var(--green);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);}
.nav{padding:10px 10px;}
.nav-item{border-left:none;border-radius:12px;margin:2px 0;padding:10px 12px;font-weight:500;color:var(--muted);}
.nav-item:hover{background:var(--s2);color:var(--text);}
.nav-item.active{background:var(--p-lav);color:var(--purple);font-weight:700;}
.nav-icon{width:22px;text-align:center;}
.btn-sync{background:var(--purple);color:var(--on-accent);border-radius:12px;font-family:inherit;font-size:13px;font-weight:700;padding:10px;}
.btn-sec{border-radius:10px;font-family:inherit;}
.topbar{background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.t-btn{border-radius:12px;background:var(--s2);}
.bottom-tabs{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.btab{border-radius:14px;margin:0 2px;padding:7px 2px;font-weight:600;font-size:10px;font-family:inherit;transition:background .15s,color .15s;}
.btab.active{background:var(--p-lav);color:var(--purple);}
.main{max-width:1100px;}
.panel{border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow);padding:18px;}
.panel-title{font-size:13px;font-weight:700;letter-spacing:.2px;text-transform:none;color:var(--text);}
.panel-action{font-family:inherit;}
.kpi{border-radius:18px;border:none;box-shadow:var(--shadow);padding:16px;}
.kpi-row .kpi:nth-child(3n+1){background:var(--p-mint);}
.kpi-row .kpi:nth-child(3n+2){background:var(--p-sky);}
.kpi-row .kpi:nth-child(3n+3){background:var(--p-rose);}
.kpi:hover{filter:brightness(.98);background-blend-mode:multiply;}
.kpi-label{font-size:11px;letter-spacing:.3px;text-transform:none;font-weight:600;color:var(--muted);}
.kpi-val{font-size:24px;font-weight:800;}
.modal-card{border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.15);}
.modal-title{font-weight:800;font-size:18px;}
.modal-sub{font-family:inherit;}
.chip{border-radius:999px;background:var(--p-lav);border:none;}
.cat-bar-track{height:8px;border-radius:99px;background:var(--s2);}
.cat-bar-fill{border-radius:99px;}
.state-block{border-radius:16px;box-shadow:var(--shadow);}
.expandable:hover{border-radius:10px;}
.relink-row{border-radius:14px;}
/* Overview header + compact connected-banks badge (top right) */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 14px;}
.page-hello{font-size:20px;font-weight:800;letter-spacing:-.02em;}
.page-sub{font-size:12px;color:var(--muted);margin-top:1px;}
.banks-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;}
.banks-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}
.banks-dot.warn{background:var(--red);}
.bank-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:none;border-radius:999px;background:var(--p-lav);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
/* Search */
.srch-input{width:100%;padding:12px 16px;background:var(--s2);border:1px solid transparent;border-radius:14px;color:var(--text);font-family:inherit;font-size:14px;outline:none;}
.srch-input:focus{border-color:var(--purple);background:var(--card);}
.seg{display:inline-flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px;}
.seg-btn{border:none;background:none;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:9px;cursor:pointer;}
.seg-btn.on{background:var(--card);color:var(--purple);box-shadow:var(--shadow);}
.srch-month{font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 4px;}
.txn{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border2);}
.txn-date{font-size:11px;color:var(--muted);width:40px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.txn-main{flex:1;min-width:0;}
.txn-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txn-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.pill{display:inline-block;background:var(--p-lav);color:var(--purple);border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:600;}
.txn-amt{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.txn-del{border:none;background:var(--p-rose);border-radius:10px;width:30px;height:30px;cursor:pointer;font-size:13px;flex-shrink:0;}
.txn-del:disabled{opacity:.5;}
.txn-restore{border:none;background:var(--p-mint);color:var(--green);border-radius:10px;padding:7px 10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:900;transition:all .25s;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translate(-50%,0);}
/* Dashboard */
.dash-net{background:radial-gradient(120% 140% at 85% 0%,#6a5bd0 0%,transparent 55%),linear-gradient(140deg,#231c4d,#3a2f80 60%,#4b4fa8);color:#fff;text-align:center;border-radius:24px;padding:24px 20px 20px;margin-bottom:14px;cursor:pointer;box-shadow:0 10px 30px rgba(35,28,77,.35);}
.dash-net-label{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.6px;text-transform:uppercase;}
.dash-net-val{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:6px 0 12px;font-variant-numeric:tabular-nums;color:#fff;}
.dash-net-sub{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:12px;color:rgba(255,255,255,.78);font-weight:600;}
.dash-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:600;margin:4px 4px 8px;}
.dash-bar{border-radius:20px;padding:14px 16px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);}
.dash-bar-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.dash-bar-title{font-size:14px;font-weight:800;}
.dash-bar-sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500;}
.dash-bar-pct{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
.dash-track{position:relative;display:flex;height:42px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(60,40,120,.08);}
.dash-fill{height:100%;}
.dash-track-text{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px;font-size:12.5px;font-weight:700;color:#241d45;white-space:nowrap;font-variant-numeric:tabular-nums;}
.dash-tt-l{overflow:hidden;text-overflow:ellipsis;min-width:0;}
.dash-bar{padding:14px 14px 14px !important;}
/* Spending timeline (Accounts) */
.tl-wrap{overflow-x:auto;margin:0 -6px;padding:2px 6px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
.tl{display:flex;gap:12px;position:relative;width:max-content;}
.tl::before{content:'';position:absolute;left:0;right:0;top:11px;height:2px;background:var(--border);}
.tl-col{width:176px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;scroll-snap-align:end;}
.tl-mon{position:relative;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;background:var(--card);padding:2px 10px;border-radius:99px;border:1px solid var(--border);}
.tl-dot{width:9px;height:9px;border-radius:50%;}
.tl-string{width:2px;height:16px;background:var(--border);}
.tl-sq{position:relative;width:132px;height:112px;border-radius:18px;background:color-mix(in srgb,var(--c) 22%,var(--card));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .15s;}
.tl-sq:hover{transform:translateY(-2px);}
.tl-sq-fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--c) 38%,transparent);}
.tl-sq-val{position:relative;font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.tl-sq-chg{position:relative;font-size:11.5px;font-weight:800;margin-top:2px;}
.tl-sq-vs{position:relative;font-size:10px;color:var(--muted);font-weight:600;}
.tl-note{width:100%;background:var(--s2);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
.tl-why{cursor:pointer;border-radius:8px;padding:2px 2px;}
.tl-why:hover{background:var(--s3);}
.tl-why-top{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:700;}
.tl-why-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-why-sub{font-size:10.5px;color:var(--muted);line-height:1.35;}

.bank-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
.bank-card-name{font-size:14px;font-weight:800;}
.acct-row{padding:8px 4px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;font-size:13px;cursor:pointer;gap:10px;}
.bank-tl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
