.bank-tl-bar{display:flex;height:6px;border-radius:99px;background:var(--card);overflow:hidden;margin-bottom:3px;}
.bank-tl-lbl{font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.bank-tl-amt{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
.bank-tl-split{font-size:9.5px;color:var(--muted);line-height:1.25;}
.bank-tl-net{font-size:11px;font-weight:800;text-align:center;border-top:1px solid var(--border);padding-top:4px;}
.dash-est{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ink) 45%,transparent) 0 6px,color-mix(in srgb,var(--ink) 22%,transparent) 6px 12px);}
.dash-cats{margin-top:14px;}
.dash-cat{padding:9px 6px;margin:0 -6px;border-radius:12px;cursor:pointer;}
.dash-cat:hover{background:var(--s2);}
.dash-cat-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
.dash-cat-name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;min-width:0;}
.dash-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dash-cat-amt{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
.dash-cat-avg{font-weight:500;color:var(--muted);font-size:11.5px;}
.dash-cat-track{position:relative;height:10px;background:var(--s2);border-radius:99px;}
.dash-cat-fill{height:100%;border-radius:99px;}
.dash-cat-mark{position:absolute;top:-3px;width:2px;height:16px;background:var(--text);opacity:.35;border-radius:2px;transform:translateX(-1px);}
.dash-modal-sum{display:flex;gap:18px;flex-wrap:wrap;background:var(--s2);border-radius:16px;padding:14px 16px;margin-bottom:6px;}
.dash-modal-sum .kpi-val{font-size:20px;}
@media(max-width:700px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  .bottom-tabs{display:block;}
  .main{padding:14px 14px 80px;}
  .two-col{grid-template-columns:1fr;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .kpi-val{font-size:18px;}
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="drawer-x" onclick="closeDrawer()">x</button>
  <div class="logo" style="padding:14px 18px 12px"><div class="logo-mark">LED<span>GR</span></div></div>
  <div class="nav" id="drawer-nav"></div>
</div>
<div class="modal-bg" id="modal" onclick="closeModal(event)">
  <div class="modal-card">
    <button class="modal-x" onclick="document.getElementById('modal').classList.remove('open')">x</button>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="shell">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-mark">LED<span>GR</span></div>
      <div class="logo-sub"><span class="dot"></span>Live via Plaid</div>
    </div>
    <div class="nav" id="sidebar-nav"></div>
    <div class="sidebar-foot">
      <button class="btn-sync" id="sync-btn" onclick="triggerSync()">Sync</button>
      <button class="btn-sec theme-btn-text" onclick="toggleTheme()" id="theme-sidebar">&#9790; Night</button>
      <button class="btn-sec" onclick="exportOverrides()" style="font-size:11px">&#128190; Export edits</button>
      <div class="synced-at" id="synced-at">--</div>
    </div>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <div class="topbar">
      <button class="hamburger" onclick="openDrawer()">&#9776;</button>
      <div class="t-logo">LED<span>GR</span></div>
      <button class="t-btn theme-btn-icon" onclick="toggleTheme()" id="theme-topbar">&#9790;</button>
      <button class="t-btn" onclick="triggerSync()" id="sync-btn-top">&#9889;</button>
    </div>
    <div id="relink-banner" hidden></div>
    <div class="main" id="main-content">
      <div style="display:flex;align-items:center;justify-content:center;height:200px;font-size:13px;color:var(--muted);font-family:'IBM Plex Mono',monospace">Loading...</div>
    </div>
  </div>
</div>
<div class="bottom-tabs"><div class="btabs" id="bottom-tabs"></div></div>
<script>
var D = null, TAB = 'overview';
var BACKEND = ''; // same-origin: /api/* proxies to Netlify Functions (see netlify.toml)
var _rawD = null;
var CAT_OVERRIDES = {};
var REFUNDED_TXNS = {}; // kept for backward compat but no longer written
try { localStorage.removeItem('lgr_refunded'); } catch(e) {} // clear old marks

// EXCLUDED — permanent hide list, triple-stored
var EXCLUDED = {};
function loadExcluded() {
  try {
    var v = localStorage.getItem('lgr_excluded') || sessionStorage.getItem('lgr_excluded');
    if(v) EXCLUDED = JSON.parse(v);
  } catch(e) {}
}
function saveExcluded() {
  try {
    var v = JSON.stringify(EXCLUDED);
    localStorage.setItem('lgr_excluded', v);
    sessionStorage.setItem('lgr_excluded', v);
  } catch(e) {}
}
loadExcluded();
try {
  // Try localStorage first, fall back to sessionStorage if localStorage was wiped
  var saved = localStorage.getItem('lgr_cat_overrides') 
    || sessionStorage.getItem('lgr_cat_overrides_session');
  CAT_OVERRIDES = JSON.parse(saved || '{}');
  if(Object.keys(CAT_OVERRIDES).length) {
    console.log('[LEDGR] Loaded', Object.keys(CAT_OVERRIDES).length, 'category overrides');
    // Restore to localStorage if it was missing
    if(!localStorage.getItem('lgr_cat_overrides')) localStorage.setItem('lgr_cat_overrides', saved);
  }
} catch(e) { console.warn('[LEDGR] Failed to load overrides:', e); }
var ALL_CATS = ['Restaurants','Groceries','Amazon','Shopping','Gas/Travel','Kids','Entertainment','Subscription','Pharmacy','Healthcare','Insurance','Tax/Professional','Home Security','Religious','Other'];
var HOME_ST = ['NJ','NY','CT','PA','MA','MD','DE'];
var BILLING = ['APPLE','AMAZON','AMZN','VZWRLSS','VERIZON','SIMPLISAFE','PAYPAL','NETFLIX','SPOTIFY','HULU','ZEE5','ANTHROPIC','CLAUDE','NORD','TURBOTAX','GOOGLE','COMCAST'];
var BANK_SHORT = {'BofA':'BOA','Wells Fargo':'WF','TD Bank':'TD','Discover':'DISC','Robinhood':'RH','wifebofa':'BOA','myrobin':'RH'};
var CAT_COLORS = {
  'Refund':'#00d084',
  'Restaurants':'#ff8c42','Groceries':'#c8f060','Amazon':'#4da8ff','Shopping':'#a78bfa',
  'Gas/Travel':'#67e8f9','Kids':'#60d0ff','Entertainment':'#c084fc','Subscription':'#818cf8','Subscription':'#818cf8',
  'Pharmacy':'#34d399','Healthcare':'#10b981','Insurance':'#f5c518','Tax/Professional':'#f87171',
  'Home Security':'#fb923c','Religious':'#e879f9','Other':'#6b6b80'
};
var PAGES = [
  {id:'overview',  label:'Overview',  icon:'&#9672;'},
  {id:'accounts',  label:'Accounts',  icon:'&#127974;'},
  {id:'travel',    label:'Travel',    icon:'&#9992;'},
  {id:'subs',      label:'Subscriptions', icon:'&#128179;'},
  {id:'zelle',     label:'Zelle',     icon:'&#128184;'},
  {id:'search',    label:'Search',    icon:'&#128269;'}
];
// 'mynw' is deliberately not in PAGES: no nav entry; it opens only by
// triple-tapping the LEDGR logo (see the logo triple-tap handler).
var _tid = 0;
function uid() { return 'el' + (++_tid); }
// Some accounts are pulled in under more than one login (e.g. BofA appears under
// both the "bofa" and "wifebofa" items), producing identical duplicate rows and
// double-counted balances. Collapse to one row per bank+mask+subtype.
function dedupAccts(list) {
  var seen = {};
  return (list || []).filter(function(a) {
    var key = a.bank + '|' + a.mask + '|' + a.subtype;
    if(seen[key]) return false;
    seen[key] = true;
    return true;
  });
}
function $(id) { return document.getElementById(id); }
function set(id, html) { var e = $(id); if(e) e.innerHTML = html; }
function fmt(n) { return '$' + Number(n||0).toLocaleString('en-US', {maximumFractionDigits:0}); }
function fmt2(n) { return '$' + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function short(s) {
  if(!s) return '';
  return s.replace(/January /,'Jan ').replace(/February /,'Feb ').replace(/March /,'Mar ')
    .replace(/April /,'Apr ').replace(/May /,'May ').replace(/June /,'Jun ')
    .replace(/July /,'Jul ').replace(/August /,'Aug ').replace(/September /,'Sep ')
    .replace(/October /,'Oct ').replace(/November /,'Nov ').replace(/December /,'Dec ')
    .replace(' 2026'," '26").replace(' 2025'," '25");
}
function expand(id) { var e = $(id); if(e) e.classList.toggle('open'); }

function saveOverrides() {
  try {
    const val = JSON.stringify(CAT_OVERRIDES);
    localStorage.setItem('lgr_cat_overrides', val);
    sessionStorage.setItem('lgr_cat_overrides_session', val); // session backup
    console.log('[LEDGR] Saved overrides:', Object.keys(CAT_OVERRIDES).length, 'edits');
  } catch(e) { console.warn('[LEDGR] Failed to save overrides:', e); }
}
function isRefunded(date, desc, amount) {
  return !!REFUNDED_TXNS[desc]; // desc-only key (kept for backward compat)
}

function applyOverrides(data) {
  if(!data || !data.monthly_spending) return data;
  var msp = data.monthly_spending;
  Object.keys(msp).forEach(function(p) {
    var v = msp[p];
    (v.transactions || []).forEach(function(t) {
      // Key is desc only — applies GLOBALLY across all months and amounts
      var override = CAT_OVERRIDES[t.desc];
      if(override && override !== t.category) {
        v.categories[t.category] = (v.categories[t.category] || 0) - t.amount;
        if(v.categories[t.category] <= 0) delete v.categories[t.category];
        v.categories[override] = (v.categories[override] || 0) + t.amount;
        t.category = override;
      }
    });
  });
  return data;
}

function setCat(desc, cat) {
  if(cat === null) { delete CAT_OVERRIDES[desc]; }
  else { CAT_OVERRIDES[desc] = cat; }
  saveOverrides();
  // Verify it was actually saved
  try {
    var check = JSON.parse(localStorage.getItem('lgr_cat_overrides') || '{}');
    if(cat && !check[desc]) console.error('[LEDGR] Override NOT saved for:', desc);
    else console.log('[LEDGR] Override confirmed saved. Total:', Object.keys(check).length);
  } catch(e) {}
  D = applyOverrides(JSON.parse(JSON.stringify(_rawD)));
  $('modal').classList.remove('open');
  render();
}

function editCat(desc, amount, currentCat) {
  // Key is desc only — change applies to ALL transactions with same name globally
  var descEsc = desc.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  var curCat = CAT_OVERRIDES[desc] || currentCat;
  var b = '<div style="font-size:13px;color:var(--muted);margin-bottom:6px;word-break:break-word">' + desc + '</div>';
  b += '<div style="font-size:11px;color:var(--yellow);margin-bottom:12px">Applies globally to all \'' + desc + '\' transactions</div>';
  b += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">';
  var allCatsNow = ALL_CATS.slice();
  // Add any custom categories from overrides
  Object.values(CAT_OVERRIDES).forEach(function(cat) {
    if(allCatsNow.indexOf(cat) < 0) allCatsNow.push(cat);
  });
  allCatsNow.forEach(function(cat) {
    var col = CAT_COLORS[cat] || '#a78bfa';
    var active = cat === curCat;
    var catEsc = cat.replace(/'/g,"\\'");
    b += '<div onclick="setCat(\'' + descEsc + '\',\'' + catEsc + '\')" style="padding:9px 12px;border-radius:8px;border:1px solid ' + (active ? col : 'var(--border)') + ';background:' + (active ? col + '22' : 'var(--s2)') + ';cursor:pointer;font-size:13px;color:' + (active ? col : 'var(--muted)') + ';font-weight:' + (active ? '600' : '400') + '">' + cat + '</div>';
  });
  b += '</div>';
  // Custom category input
  b += '<div style="display:flex;gap:8px;margin-bottom:10px">';
  b += '<input id="custom-cat-input" placeholder="New category name..." style="flex:1;padding:8px 10px;background:var(--s2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:IBM Plex Mono,monospace;font-size:12px">';
  b += '<button onclick="addCustomCat(\'' + descEsc + '\')" style="padding:8px 14px;background:var(--green);color:#000;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer">Add</button>';
  b += '</div>';
  if(CAT_OVERRIDES[desc]) {
    b += '<button onclick="setCat(\'' + descEsc + '\',null)" style="font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--s2);color:var(--muted);cursor:pointer">Reset to original</button>';
  }
  openModal('Recategorize', 'Global — affects all months', b);
}

function addCustomCat(desc) {
  var input = document.getElementById('custom-cat-input');
  var val = input ? input.value.trim() : '';
  if(!val) return;
  // Capitalize first letter of each word
  val = val.replace(/\b\w/g, function(c){return c.toUpperCase();});
  setCat(desc, val);
}

function txnLine(t, col, extraStyle) {
  var isEdited = !!CAT_OVERRIDES[t.desc];
  var isRefund = t.amount < 0;
  var effectiveCol = isRefund ? 'var(--green)' : col;
  var style = 'display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--border2);font-size:12px;' + (extraStyle || '');
  var bankLabel = '';
  if (t.bank) {
    var bankShort = BANK_SHORT[t.bank] || t.bank.substring(0,4).toUpperCase();
    bankLabel = '<span style="font-size:9px;font-family:IBM Plex Mono,monospace;color:var(--muted2);background:var(--s2);border-radius:3px;padding:1px 4px;flex-shrink:0;margin-right:2px">' + bankShort + '</span>';
  }
  if (t.mask) {
    bankLabel += '<span style="font-size:9px;font-family:IBM Plex Mono,monospace;color:var(--muted2);background:var(--s2);border-radius:3px;padding:1px 4px;flex-shrink:0;margin-right:2px">••' + t.mask + '</span>';
  }
  var refundBadge = isRefund ? '<span style="font-size:9px;color:var(--green);background:rgba(0,208,132,0.15);border-radius:3px;padding:1px 5px;margin-left:4px;font-weight:600">+REFUND</span>' : '';
  var pendingBadge = t.pending ? '<span style="font-size:9px;color:var(--yellow);margin-left:3px">⏳</span>' : '';
  // Encode desc safely for inline onclick attribute
  var descEsc = t.desc.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  var catEsc = (CAT_OVERRIDES[t.desc] || t.category || 'Other').replace(/'/g,"\\'");
  var html = '<div style="' + style + (t.pending ? 'opacity:0.75;' : '') + '">';
  html += '<span style="font-family:IBM Plex Mono,monospace;color:var(--muted);width:40px;flex-shrink:0">' + (t.date || '') + '</span>';
  html += bankLabel;
  html += '<span style="flex:1;word-break:break-word;line-height:1.4;color:var(--muted)">' + t.desc + refundBadge + pendingBadge + (isEdited ? '<span class="edited-badge">*</span>' : '') + '</span>';
  html += '<span style="font-family:IBM Plex Mono,monospace;color:' + effectiveCol + ';white-space:nowrap;margin-right:6px">' + (isRefund ? '+' : '') + fmt2(Math.abs(t.amount)) + '</span>';
  // Refund toggle button
  var dateEsc = (t.date||'').replace(/'/g,"\'");
  // refund button removed — server now provides negative transactions for auto-matching
  html += '<button class="edit-btn" onclick="editCat(\'' + descEsc + '\',' + t.amount + ',\'' + catEsc + '\')">&#9998;</button>';
  var exStyle = (EXCLUDED && EXCLUDED[t.desc]) ? 'color:var(--yellow);' : 'color:var(--muted2);';
  html += '<button class="edit-btn" style="' + exStyle + '" title="Exclude/restore" onclick="toggleExclude(\'' + descEsc + '\')">' + ((EXCLUDED && EXCLUDED[t.desc]) ? '↩' : '✕') + '</button>';
  html += '</div>';
  return html;
}

function buildMonthlyCats(ms, period) {
  var v = ms[period];
  if (!v) return '<div style="color:var(--muted);font-size:13px;padding:8px 0">No data.</div>';
  var cats = Object.entries(v.categories || {}).sort(function(a,b){return b[1]-a[1];});
  var maxCat = cats.length ? cats[0][1] : 1;
  var html = '';
  cats.forEach(function(e, ci) {
    var col = CAT_COLORS[e[0]] || '#6b6b80';
    var pct = Math.round(e[1] / maxCat * 100);
    var txns = (v.transactions || []).filter(function(t){ return t.category === e[0]; }).sort(function(a,b){return b.date.localeCompare(a.date);});
    var cid = 'mc_' + period + '_' + ci;
    html += '<div>';
    html += '<div class="cat-bar-row expandable" onclick="expand(\'' + cid + '\')">';
    html += '<div class="cat-bar-label" style="color:' + col + '">' + e[0] + '</div>';
    html += '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:' + pct + '%;background:' + col + '"></div></div>';
    html += '<div class="cat-bar-amt" style="color:' + col + '">' + fmt(e[1]) + '</div>';
    html += '</div>';
    html += '<div id="' + cid + '" class="expand-body">';
    txns.forEach(function(t){ html += txnLine(t, col, ''); });
    html += '</div></div>';
  });
  return html;
}

function selectMonth(period) {
  var ms = D.monthly_spending || {};
  var periods = Object.keys(ms).sort().reverse();
  // Update tab styles
  periods.forEach(function(p) {
    var tab = $('mtab_' + p);
    if (!tab) return;
    var isActive = p === period;
    tab.style.borderColor = isActive ? 'var(--green)' : 'var(--border)';
    tab.style.background = isActive ? 'rgba(0,208,132,0.12)' : 'var(--s2)';
    tab.style.color = isActive ? 'var(--green)' : 'var(--muted)';
  });
  // Update category bars
  var el = $('monthly-cats');
  if (el) el.innerHTML = buildMonthlyCats(ms, period);
  // Update total in panel head
  var v = ms[period];
  var actionEl = el ? el.closest('.panel') : null;
  if (actionEl) {
    var action = actionEl.querySelector('.panel-action');
    if (action) action.textContent = fmt(v ? v.total : 0);
  }
}

function buildNav() {
  var html = '';
  PAGES.forEach(function(p) {
    html += '<div class="nav-item' + (p.id === TAB ? ' active' : '') + '" onclick="switchTab(\'' + p.id + '\')">';
    html += '<span class="nav-icon">' + p.icon + '</span>' + p.label + '</div>';
  });
  set('sidebar-nav', html);
  set('drawer-nav', html);
  set('bottom-tabs', PAGES.map(function(p) {
    return '<button class="btab' + (p.id === TAB ? ' active' : '') + '" onclick="switchTab(\'' + p.id + '\')">'
      + '<span class="btab-icon">' + p.icon + '</span>' + p.label + '</button>';
  }).join(''));
}

function switchTab(id) { if(id !== 'mynw') MYNW_UNLOCKED = false; TAB = id; buildNav(); render(); }
function openDrawer() { $('drawer').classList.add('open'); $('overlay').classList.add('open'); }
function closeDrawer() { $('drawer').classList.remove('open'); $('overlay').classList.remove('open'); }
function openModal(title, sub, body) { set('modal-title', title); set('modal-sub', sub); set('modal-body', body); $('modal').classList.add('open'); }
function closeModal(e) { if(e.target === $('modal')) $('modal').classList.remove('open'); }
function toggleTheme() {
  var t = document.documentElement.getAttribute('data-theme');
  var next = t === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('lgr-theme', next);
  var sb = document.getElementById('theme-sidebar');
  var tb = document.getElementById('theme-topbar');
  if(sb) sb.innerHTML = next === 'dark' ? '&#9728; Day' : '&#9790; Night';
  if(tb) tb.innerHTML = next === 'dark' ? '&#9728;' : '&#9790;';
  if(_chartInst) { _chartInst.destroy(); _chartInst = null; }
  render();
}
(function() {
  var t = localStorage.getItem('lgr-theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
})();

function render() {
  renderRelinkBanner();
  if(!D) { set('main-content', '<div style="display:flex;align-items:center;justify-content:center;height:200px;font-size:13px;color:var(--muted);font-family:IBM Plex Mono,monospace">No data. Tap Sync.</div>'); return; }
  _tid = 0;
  if(TAB === 'overview') renderOverview();
  else if(TAB === 'accounts') renderAccounts();
  else if(TAB === 'travel') renderTravel();
  else if(TAB === 'subs') renderSubscriptions();
  else if(TAB === 'zelle') renderZelle();
  else if(TAB === 'search') renderSearch();
  else if(TAB === 'mynw') renderMyNetworth();
}

var _chartInst = null;

// ── Connected banks (Overview) ────────────────────────────────
var BANK_NAMES = {
  bofa:'Bank of America', wifebofa:'Bank of America · Wife', wf:'Wells Fargo',
  td:'TD Bank', pnc:'PNC', discover:'Discover', amex:'Amex', chase:'Chase',
  zillow:'Rocket Mortgage', rocket:'Rocket Mortgage',
  robin:'Robinhood', robin_2:'Robinhood', robin_3:'Robinhood', myrobin:'Robinhood · Brokerage'
};
function bankKeyOf(a){ return (a.nickname || a._nickname || a.bank || '?').toString().toLowerCase(); }
function bankLabelOf(key, fallback){ return BANK_NAMES[key] || fallback || key; }

// ── Re-link banner ────────────────────────────────────────────
// A dead bank used to be visible only inside sync_status in the JSON, which
// is how the wife's BofA login sat broken from late September to mid-November:
// every sync reported success overall, and her accounts simply stopped being
// in the file. This surfaces it on every tab with a one-tap fix.
//
// Only codes a re-login can actually fix belong here. PRODUCTS_NOT_SUPPORTED
// is Discover's plan limit on /transactions/refresh — re-linking changes
// nothing, and a banner that cannot be cleared trains you to ignore banners.
var RELINK_CODES = /ITEM_LOGIN_REQUIRED|ITEM_LOCKED|PENDING_EXPIRATION|PENDING_DISCONNECT|ITEM_NOT_FOUND|INVALID_ACCESS_TOKEN|ACCESS_NOT_GRANTED/i;
function banksNeedingRelink() {
  var ss = (D && D.sync_status) || {};
  var out = [], seen = {};
  // An Item that returned nothing at all: no balances, no transactions.
  (ss.detail || []).forEach(function(x) {
    if (!x || x.ok) return;
    var code = x.error || 'SYNC_FAILED';
    if (/PRODUCTS_NOT_SUPPORTED/i.test(code)) return;
    seen[x.nickname] = 1;
    out.push({ nickname: x.nickname, code: code, dead: true });
  });
  // Still returning balances, but the bank refused a live refresh — the
  // early warning that a login is about to expire.
  var re = ss.refresh_errors || {};
  Object.keys(re).forEach(function(nick) {
    if (seen[nick] || !RELINK_CODES.test(re[nick] || '')) return;
    out.push({ nickname: nick, code: re[nick], dead: false });
  });
  return out;
}
function renderRelinkBanner() {
  var el = $('relink-banner');
  if (!el) return;
  var broken = banksNeedingRelink();
  if (!broken.length) { el.hidden = true; el.innerHTML = ''; return; }
  var html = '';
  broken.forEach(function(b) {
    var why = /LOGIN_REQUIRED|LOCKED|ACCESS_NOT_GRANTED|INVALID_ACCESS_TOKEN|ITEM_NOT_FOUND/i.test(b.code)
      ? 'needs you to log in again'
      : /PENDING/i.test(b.code) ? 'will stop updating unless you log in again'
      : 'is not syncing (' + b.code + ')';
    var note = b.dead
      ? 'No balances or transactions from this bank until it is re-linked.'
      : 'Balances still load, but its transactions are going stale.';
    html += '<div class="relink-row"><div class="relink-txt"><b>&#9888; ' + bankLabelOf(b.nickname, b.nickname) + '</b> ' + why
      + '<span class="relink-sub">' + note + '</span></div>'
      + '<button class="relink-btn" onclick="goRelink(\'' + b.nickname + '\')">Re-link now &rarr;</button></div>';
  });
  el.innerHTML = html;
  el.hidden = false;
}
// link.html reads ?nickname= and pre-fills the field with step-by-step text,
// so this is one tap from seeing the problem to the bank's login screen.
function goRelink(nick) { location.href = 'link.html?nickname=' + encodeURIComponent(nick); }
function renderBanksStrip(accts) {
  if(!accts || !accts.length) return '';
  var groups = {};
  accts.forEach(function(a){ var k = bankKeyOf(a); (groups[k] = groups[k] || []).push(a); });
  window._bankGroups = groups;
  var keys = Object.keys(groups).sort();
  window._bankKeys = keys; window._bankAcctCount = accts.length;
  // Compact: a page header with one small badge at the top right. The full
  // list opens in a popup, so it no longer pushes the numbers down the page.
  var failed = ((D.sync_status && D.sync_status.failed) || []).length;
  var hour = new Date().getHours();
  var hello = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  var when = D.generated_at ? new Date(D.generated_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '';
  return '<div class="page-head"><div><div class="page-hello">'+hello+'</div><div class="page-sub">Updated '+esc(when)+'</div></div>'
    + '<button class="banks-badge" onclick="showBanks()"><span class="banks-dot'+(failed?' warn':'')+'"></span>'+keys.length+' banks · '+accts.length+' accts</button></div>';
}
function showBanks(){
  var groups = window._bankGroups || {}, keys = window._bankKeys || [];
  var chips = keys.map(function(k){
    var g = groups[k];
    var hasCredit = g.some(function(x){ return x.is_credit; });
    return '<button class="bank-chip" onclick="_showBank(\''+k+'\')"><span class="banks-dot" style="background:'+(hasCredit?'var(--yellow)':'var(--green)')+'"></span>'
      + esc(bankLabelOf(k, g[0].bank)) + '<span style="color:var(--muted);font-size:11px">'+g.length+'</span></button>';
  }).join('');
  openModal('Connected banks', keys.length+' institutions · '+(window._bankAcctCount||0)+' accounts',
    '<div style="display:flex;flex-wrap:wrap;gap:8px">'+chips+'</div><div style="font-size:11px;color:var(--muted);margin-top:12px">Tap a bank to see its accounts. Missing one? Re-link it via the Plaid helper.</div>');
}
function _showBank(key) {
  var g = (window._bankGroups && window._bankGroups[key]) || [];
  var label = bankLabelOf(key, g[0] && g[0].bank);
  var b = '';
  g.forEach(function(x){ b += acctLine(x); });
  openModal(label, g.length + ' accounts', b || '<div style="color:var(--muted)">No accounts</div>');
}

// ── Insights (Overview): money in, money out, what's left — plain words ──
// Built on D.cashflow (see buildCashflow in _core.js), which has already
// dropped card payments, moves between our own accounts and self-Zelle.
function renderInsights() {
  var cf = D.cashflow;
  var wrap = function(head, body){
    return '<div class="panel"><div class="panel-head"><div class="panel-title">Insights</div><div class="panel-action">'+head+'</div></div>'
      + '<div style="display:flex;flex-direction:column;gap:14px;font-size:13px;line-height:1.5">'+body+'</div></div>';
  };
  if(!cf) return wrap('', '<div style="color:var(--muted)">Insights appear after the next sync. Tap Sync.</div>');

  var periods = Object.keys(cf).sort();
  var show = periods.slice(-2);                 // last month + this month
  var cur = periods[periods.length-1];
  var hist = periods.filter(function(p){ return p !== cur; }).slice(-6); // last 6 full months
  var mName = function(p){ return new Date(p+'-15T00:00:00').toLocaleString('en-US',{month:'long'}); };
  var line = function(icon, h){ return '<div style="display:flex;gap:8px">'+(icon ? '<span>'+icon+'</span>' : '')+'<div>'+h+'</div></div>'; };
  var head = function(t){ return '<div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px">'+t+'</div>'; };
  var html = '';

  // 1. In / out / left — one card per month
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px">';
  show.forEach(function(p){
    var m = cf[p], inc = m.income.total, out = m.spent.total, left = inc - out;
    var partial = m.days < m.days_in_month;
    var pct = inc > 0 ? Math.max(0, Math.min(100, Math.round(left/inc*100))) : 0;
    var col = left >= 0 ? 'var(--green)' : 'var(--red)';
    // click: 'in' | 'out' opens the transactions behind that amount.
    var row = function(lbl, v, c, b, click){
      var tap = (click && (m['tx_'+click]||[]).length) ? ' onclick="showFlow(\''+p+'\',\''+click+'\')" style="cursor:pointer;font-family:IBM Plex Mono,monospace;color:'+c+';text-decoration:underline dotted;text-underline-offset:3px"' : ' style="font-family:IBM Plex Mono,monospace;color:'+c+'"';
      return '<div style="display:flex;justify-content:space-between;padding:3px 0'+(b?';font-weight:700':'')+'"><span>'+lbl+'</span><span'+tap+'>'+v+(tap.indexOf('onclick')>0?' ›':'')+'</span></div>';
    };
    html += '<div style="background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:12px">';
    html += '<div style="font-weight:700;margin-bottom:6px">'+mName(p)+(partial ? ' <span style="font-weight:400;font-size:11px;color:var(--muted)">so far · day '+m.days+' of '+m.days_in_month+'</span>' : '')+'</div>';
    html += row('💵 Came in', fmt(inc), 'var(--text)', false, 'in');
    html += row('🛒 Went out', fmt(out), 'var(--text)', false, 'out');
    html += '<div style="border-top:1px solid var(--border);margin:4px 0"></div>';
    html += row(left >= 0 ? '🐷 Left to save' : '⚠️ Spent more than earned', fmt(Math.abs(left)), col, true);
    html += '<div style="height:6px;background:var(--border);border-radius:3px;margin:6px 0 4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+col+'"></div></div>';
    html += '<div style="font-size:11px;color:var(--muted)">'+(left >= 0 ? 'You kept '+pct+'¢ of every $1.' : 'Spending was bigger than income.');
    var moved = [];
    if(m.moved.invested) moved.push(fmt(m.moved.invested)+' to Robinhood');
    if(moved.length) html += ' Moved '+moved.join(' and ')+' (not counted as spending).';
    html += '</div>';
    var outBits = [];
    if(m.spent.loans) outBits.push('home/car loans '+fmt(m.spent.loans));
    if(m.spent.india) outBits.push('sent to India '+fmt(m.spent.india));
    if(m.spent.fees) outBits.push('<span style="color:var(--red)">fees '+fmt(m.spent.fees)+'</span>');
    if(outBits.length) html += '<div style="font-size:11px;color:var(--muted);margin-top:2px">Out includes '+outBits.join(', ')+'.</div>';
    html += '</div>';
  });
  html += '</div>';
  var ignored = show.reduce(function(s,p){ return s + cf[p].internal.total; }, 0);
  if(ignored) html += '<div style="font-size:11px;color:var(--muted);margin-top:-6px">Ignored '+fmt(ignored)+' of card payments and moves between your own accounts, so nothing is counted twice.</div>';

  // Typical month per category = average over up to 6 full months before p.
  var avgCat = function(cat, before){
    var ps = periods.filter(function(x){ return x < before; }).slice(-6);
    if(!ps.length) return 0;
    return ps.reduce(function(s,x){ return s + (cf[x].by_category[cat]||0); }, 0) / ps.length;
  };

  // 2. Unusual spending in the months shown
  var odd = [];
  show.forEach(function(p){
    var m = cf[p];
    Object.keys(m.by_category).forEach(function(cat){
      if(cat === 'Refund') return;
      var v = m.by_category[cat], avg = avgCat(cat, p);
      if(v < 150) return;
      var isNew = avg < 25;
      if(isNew || (v > avg*1.5 && v - avg > 150)){
        var big = (m.big||[]).filter(function(b){ return flowCat(b.desc) === cat; })[0];
        var tapCat = (m.tx_out||[]).length ? ' onclick="showFlow(\''+p+'\',\'out\',\''+esc(cat).replace(/'/g,'\\\'')+'\')" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px"' : '';
        odd.push({ d: v - avg, html: '<b'+tapCat+'>'+esc(cat)+'</b> '+fmt(v)+' in '+mName(p)+' — '+(isNew ? 'new, you don’t usually spend here' : 'usually ~'+fmt(avg)+'/month')+(big ? ' (mostly '+esc(cleanDesc(big.desc))+')' : '')+'.' });
      }
    });
  });
  odd.sort(function(a,b){ return b.d - a.d; });
  html += '<div>'+head('🔍 Unusual spending')+(odd.length ? odd.slice(0,4).map(function(o){ return line('•', o.html); }).join('') : line('✅','Nothing unusual — spending looks normal.'))+'</div>';

  // 3. Where to save — judged on the last 6 full months
  var n = hist.length || 1;
  var sumOver = function(fn){ return hist.reduce(function(s,p){ return s + fn(cf[p]); }, 0); };
  var tips = [];
  var fees = sumOver(function(m){ return m.spent.fees; });
  var feeItems = [].concat.apply([], hist.map(function(p){ return cf[p].fees || []; }));
  if(fees > 0){
    var fk = {}; feeItems.forEach(function(f){ var k = f.label || 'other'; fk[k] = (fk[k]||0) + f.amount; });
    var FIX = { interest:'card interest — pay the full card balance', late:'late fees — turn on autopay', overdraft:'overdraft fees — keep a cushion in checking',
                maintenance:'monthly account fees — ask for a free account or keep the minimum balance', annual:'card annual fee — ask to waive or downgrade', atm:'ATM fees — use your own bank’s ATM', other:'other fees' };
    var ks = Object.keys(fk).sort(function(a,b){ return fk[b]-fk[a]; });
    var parts = ks.slice(0,3).map(function(k){ return fmt(fk[k])+' '+FIX[k]; });
    var rest = ks.slice(3).reduce(function(s,k){ return s + fk[k]; }, 0);
    if(rest >= 1) parts.push(fmt(rest)+' other fees');
    tips.push({ save: fees/n, html: '💳 <b>Bank & card fees: '+fmt(fees)+' in '+n+' months</b> — money for nothing. '+parts.join('; ')+'.' });
  }
  var aiTot = sumOver(function(m){ return m.by_category['AI tools']||0; });
  if(aiTot > 0){
    // One company bills under several names ("Claude Sub Anthropic.comca",
    // "Anthropic", "Claude.ai") — group by company before judging.
    var aiM = {}; hist.forEach(function(p){ Object.keys(cf[p].ai||{}).forEach(function(k){ var v = aiVendor(k); aiM[v] = (aiM[v]||0) + cf[p].ai[k]; }); });
    var names = Object.keys(aiM).sort(function(a,b){ return aiM[b]-aiM[a]; });
    var per = names.map(function(k){ return esc(k)+' ~'+fmt(aiM[k]/n)+'/mo'; }).join(', ');
    var aiTip = names.length > 1
      ? ' Several AI tools do the same job — keep '+esc(names[0])+' and drop the rest to save ~'+fmt((aiTot - aiM[names[0]])/n*12)+'/year.'
      : (aiTot/n > 30 ? ' If you don’t use it every day, a cheaper plan (~$20) saves ~'+fmt((aiTot/n - 20)*12)+'/year.' : ' Small and steady — fine if you use it.');
    tips.push({ save: aiTot/n/2, html: '🤖 <b>AI tools: ~'+fmt(aiTot/n)+'/month</b> ('+per+').'+aiTip });
  }
  var food = sumOver(function(m){ return (m.by_category['Food delivery']||0) + (m.by_category['Restaurants']||0); });
  if(food/n > 100){
    tips.push({ save: food/n/4, html: '🍔 <b>Eating out + delivery: ~'+fmt(food/n)+'/month.</b> Cutting a quarter of it saves ~'+fmt(food/n/4*12)+'/year.' });
  }
  var shop = sumOver(function(m){ return (m.by_category['Shopping']||0) + (m.by_category['Amazon']||0); });
  if(shop/n > 300){
    tips.push({ save: shop/n/5, html: '📦 <b>Shopping + Amazon: ~'+fmt(shop/n)+'/month.</b> Waiting 48 hours before non-essential buys could save ~'+fmt(shop/n/5*12)+'/year.' });
  }
  var bounced = [].concat.apply([], hist.concat([cur]).map(function(p){ return cf[p].bounced || []; }));
  if(bounced.length){
    var maxB = bounced.reduce(function(s,b){ return Math.max(s, b.amount); }, 0);
    tips.push({ save: 1e9, html: '⚠️ <b>'+bounced.length+' payment'+(bounced.length>1?'s':'')+' bounced</b> (largest '+fmt(maxB)+') because checking ran short. Each bounce brings fees and can hurt your credit. Keep about '+fmt(Math.ceil(maxB/500)*500)+' extra in checking before the mortgage date.' });
  }
  tips.sort(function(a,b){ return b.save - a.save; });
  if(fees === 0) tips.push({ html: '✅ No card interest or fees in '+n+' months — nice.' });
  html += '<div>'+head('💡 Where you can save · last '+n+' months')+tips.slice(0,5).map(function(t){ return line('', t.html); }).join('')+'</div>';

  var lbl = show.map(function(p){ return mName(p).slice(0,3); }).join(' · ');
  return wrap(lbl, html);
}
// Popup: every transaction behind a month's "Came in" or "Went out", grouped
// (by source for income, by category for spending), biggest group first.
// Tap a group to open its list; `focus` opens one group straight away.
function showFlow(p, dir, focus){
  var m = D.cashflow && D.cashflow[p]; if(!m) return;
  var items = m['tx_'+dir] || [];
  var mon = new Date(p+'-15T00:00:00').toLocaleString('en-US',{month:'long', year:'numeric'});
  var groups = {};
  items.forEach(function(x){ (groups[x.g] = groups[x.g] || []).push(x); });
  var sum = function(l){ return l.reduce(function(s,x){ return s + x.a; }, 0); };
  var names = Object.keys(groups).sort(function(a,b){ return sum(groups[b]) - sum(groups[a]); });
  var total = sum(items);
  var section = function(g, list, open){
    var id = uid(), t = sum(list);
    var rows = list.slice().sort(function(a,b){ return Math.abs(b.a) - Math.abs(a.a); }).map(function(x){
      return '<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0 5px 14px;font-size:12px;border-top:1px solid var(--border2)">'
        + '<span style="color:var(--muted);min-width:38px">'+esc(x.d)+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(cleanDesc(x.n))+'</span>'
        + '<span style="font-family:IBM Plex Mono,monospace;color:'+(x.a<0?'var(--green)':'var(--text)')+'">'+(x.a<0?'−':'')+fmt2(Math.abs(x.a))+'</span>'
        + (x.id ? '<button class="txn-del" title="Delete everywhere" onclick="event.stopPropagation();deleteTxn(\''+esc(x.id)+'\', this, \''+esc(cleanDesc(x.n)).replace(/\\/g,'\\\\').replace(/'/g,'\\\'')+'\')">🗑</button>' : '')
        + '</div>';
    }).join('');
    var pct = total ? Math.round(t/total*100) : 0;
    return '<div style="border-bottom:1px solid var(--border)">'
      + '<div onclick="var e=document.getElementById(\''+id+'\');e.style.display=e.style.display===\'none\'?\'block\':\'none\'" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer">'
      + '<span><b>'+esc(g)+'</b> <span style="font-size:11px;color:var(--muted)">'+list.length+' · '+(pct>0?pct+'%':'')+'</span></span>'
      + '<span style="font-family:IBM Plex Mono,monospace;font-weight:600;color:'+(t<0?'var(--green)':'var(--text)')+'">'+(t<0?'−':'')+fmt2(Math.abs(t))+' ›</span></div>'
      + '<div id="'+id+'" style="display:'+(open?'block':'none')+';padding-bottom:8px">'+rows+'</div></div>';
  };
  var b = names.map(function(g){ return section(g, groups[g], g === focus); }).join('');
  b += '<div style="display:flex;justify-content:space-between;padding:12px 0 4px;font-weight:700"><span>Total</span><span style="font-family:IBM Plex Mono,monospace">'+fmt2(total)+'</span></div>';
  if(dir === 'out' && (m.tx_moved||[]).length){
    var mv = {}; m.tx_moved.forEach(function(x){ (mv[x.g] = mv[x.g] || []).push(x); });
    b += '<div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 2px">Not counted as spending</div>';
    b += Object.keys(mv).map(function(g){ return section(g, mv[g], false); }).join('');
  }
  b += '<div style="font-size:11px;color:var(--muted);margin-top:10px">Card payments and moves between your own accounts are left out'+(dir==='out'?'; refunds and bounced payments show in green and reduce the total':'')+'. Tap a group to see its transactions.</div>';
  openModal(dir === 'in' ? 'Money in · '+mon : 'Money out · '+mon, dir === 'in' ? 'Where your income came from' : 'Where your money went, by category', b);
}
function aiVendor(k){
  var n = String(k).toUpperCase();
  if(/ANTHROPIC|CLAUDE/.test(n)) return 'Claude';
  if(/OPENAI|CHATGPT/.test(n)) return 'ChatGPT';
  if(/GEMINI|GOOGLE/.test(n)) return 'Gemini';
  if(/REPLIT/.test(n)) return 'Replit';
  if(/CURSOR/.test(n)) return 'Cursor';
  if(/COPILOT|GITHUB/.test(n)) return 'GitHub Copilot';
  if(/PERPLEXITY/.test(n)) return 'Perplexity';
  if(/MIDJOURNEY/.test(n)) return 'Midjourney';
  return String(k).split(/\s+/)[0];
}
// Raw bank lines ("PURCHASE 1019 FRAGOMEN FRAGOMEN.COM NJ XXX…") → "Fragomen".
function cleanDesc(d){
  var s = String(d||'').replace(/^(PURCHASE|CHECKCARD|POS|DEBIT CARD PURCHASE)\s*\d*\s*/i,'')
    .split(/\s+(?:X{3,}|\d{4,}|[A-Z]{2}\s+X)|\.COM|\s+DES:/i)[0].trim();
  var w = s.split(/\s+/); if(w.length > 1 && w[0].toUpperCase() === w[1].toUpperCase()) w.shift();
  s = w.slice(0,3).join(' ');
  return s === s.toUpperCase() ? s.toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); }) : s;
}
// Same buckets as flowCategory() in _core.js, to tie a big charge to its category.
function flowCat(desc){
  var n = String(desc||'').toUpperCase();
  if(/OPENAI|CHATGPT|ANTHROPIC|CLAUDE|MIDJOURNEY|PERPLEXITY|CURSOR\b|COPILOT|GEMINI|AITUBO|ELEVENLABS|RUNWAYML|REPLIT|LOVABLE|SUNO\b|GROK|POE\.COM|CHARACTER\.AI|JASPER/.test(n)) return 'AI tools';
  if(/KUMON|BEST BRAINS|BIG BLUE|SWIM SCHOOL|SCHOLASTIC|BRIGHTCHAMP|TUTOR|KIDS EVENT/.test(n)) return 'Kids';
  if(/COVERED EXTERIOR|HOME DEPOT|LOWE'?S|CONTRACTOR|ROOFING|LIGHT INSTALLATION/.test(n)) return 'Home projects';
  if(/FRAGOMEN|LAW |ATTORNEY|LEGAL|USCIS/.test(n)) return 'Legal/immigration';
  return '';
}

// ── Dashboard (Overview top): net balance, this month vs usual, categories ──
// Layout from the owner's design: one Net Balance card, then two bars —
// subscriptions/recurring and everything else — whose full width is the
// 6-month average and whose fill is this month (paid solid, still-expected
// recurring striped), then one bar per category, biggest first. Every block
// opens its transactions.
var DASH_COLORS = ['#a99bf5','#86d3b5','#f5a9bf','#8fb6f2','#f3c58b','#9fd8e6','#d4a9ee','#b9dd96','#f2a88c','#a5b2f3','#e8b0d8','#9fd9c4'];

// Merchant key that survives the noise in bank lines (conf#, ids, dates), and
// folds a merchant's different names together — PSE&G billed as "Public
// Service" until August and "Pse&g" after, which split it into two merchants
// that each looked too rare to be recurring.
var MERCH_ALIASES = { 'public service':'pse&g', 'pseg':'pse&g', 'public service electric':'pse&g' };
function merchKey(x){
  var k = String(x.n||'').toLowerCase()
    .replace(/conf#.*|des:.*|id:.*|indn:.*|web id.*/g,'')
    .replace(/\d{3,}/g,'').replace(/[^a-z& ]/g,' ').trim()
    .split(/\s+/).slice(0,5).join(' ') || x.g;
  return MERCH_ALIASES[k] || k;
}

// Recurring = a subscription or bill: charged in >= 3 of the last 6 full
// months, at most twice a month, at a near-constant amount (within 25% of its
// median), and not an everyday-shopping category — so the weekly ShopRite run
// or Amazon orders don't pass for subscriptions. Home/car loans always count.
// Returns {key: {median, day, months}}.
var LOOSE_RECURRING_GROUPS = { 'Bills & utilities':1, 'Kids':1, 'Bank & card fees':1 };
var NOT_RECURRING_GROUPS = { 'Groceries':1, 'Restaurants':1, 'Food delivery':1, 'Gas/Travel':1, 'Shopping':1, 'Amazon':1, 'Sent to India':1, 'Refunds & cashback':1, 'Home projects':1 };
function findRecurring(cf, hist){
  var seen = {};
  hist.forEach(function(p){
    var byKey = {};
    (cf[p].tx_out||[]).forEach(function(x){
      if(x.a <= 0 || NOT_RECURRING_GROUPS[x.g]) return;
      var k = merchKey(x);
      var e = byKey[k] = byKey[k] || { amt:0, n:0, day:+String(x.d).slice(3,5), loan: x.g === 'Home & car loans', bill: !!LOOSE_RECURRING_GROUPS[x.g] };
      e.amt += x.a; e.n++;
    });
    Object.keys(byKey).forEach(function(k){ (seen[k] = seen[k] || []).push({ p:p, amt:byKey[k].amt, n:byKey[k].n, day:byKey[k].day, loan:byKey[k].loan, bill:byKey[k].bill }); });
  });
  var med = function(a){ var s = a.slice().sort(function(x,y){ return x-y; }); var m = s.length>>1; return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };
  var out = {};
  Object.keys(seen).forEach(function(k){
    var h = seen[k], amts = h.map(function(e){ return e.amt; }), m = med(amts);
    // Utilities and kids' classes swing with the season or the number of
    // sessions, so they get a looser band than a fixed-price subscription.
    var lo = h.some(function(e){ return e.bill; }) ? 0.5 : 0.75, hi = lo === 0.5 ? 2 : 1.25;
    var steady = amts.filter(function(a){ return a >= m*lo && a <= m*hi; }).length >= 3;
    var monthly = h.every(function(e){ return e.n <= 2; });
    if(h.some(function(e){ return e.loan; }) || (h.length >= 3 && steady && monthly)){
      out[k] = { median: m, day: Math.round(med(h.map(function(e){ return e.day; }))), months: h.map(function(e){ return e.p; }) };
    }
  });
  return out;
}

function monthBudget(){
  var cf = D.cashflow; if(!cf) return null;
  var periods = Object.keys(cf).sort();
  var cur = periods[periods.length-1];
  var hist = periods.filter(function(p){ return p < cur; }).slice(-6);
  if(!hist.length) return null;
  var rec = findRecurring(cf, hist);
  var split = function(p){
    var s = { sub:[], non:[] };
    (cf[p].tx_out||[]).forEach(function(x){ (rec[merchKey(x)] && x.a > 0 ? s.sub : s.non).push(x); });
    return s;
  };
  var sum = function(l){ return l.reduce(function(t,x){ return t + x.a; }, 0); };
  var now = split(cur), m = cf[cur];
  // Still to come this month: recurring merchants active lately (in at least
  // one of the last 2 months) that haven't charged yet.
  var paidKeys = {}; now.sub.forEach(function(x){ paidKeys[merchKey(x)] = true; });
  var recent = hist.slice(-2);
  var expected = [];
  if(m.days < m.days_in_month){
    Object.keys(rec).forEach(function(k){
      var r = rec[k];
      if(paidKeys[k] || !r.months.some(function(p){ return recent.indexOf(p) >= 0; })) return;
      expected.push({ key:k, a:r.median, day:r.day, late: r.day < m.days - 3 });
    });
  }
  expected.sort(function(a,b){ return a.day - b.day; });
  var avg = { sub:0, non:0 };
  hist.forEach(function(p){ var s = split(p); avg.sub += sum(s.sub); avg.non += sum(s.non); });
  avg.sub /= hist.length; avg.non /= hist.length;
  // Categories: this month's spend per group vs that group's 6-month average.
  var cats = {};
  (m.tx_out||[]).forEach(function(x){ if(x.g !== 'Refunds & cashback') cats[x.g] = (cats[x.g]||0) + x.a; });
  var catAvg = function(g){ return hist.reduce(function(t,p){ return t + (cf[p].tx_out||[]).reduce(function(u,x){ return x.g === g ? u + x.a : u; }, 0); }, 0) / hist.length; };
  var catList = Object.keys(cats).filter(function(g){ return cats[g] > 0.5; })
    .map(function(g){ return { g:g, v:cats[g], avg:catAvg(g) }; })
    .sort(function(a,b){ return b.v - a.v; });
  return { cur:cur, m:m, now:now, expected:expected, avg:avg, cats:catList, rec:rec,
           paidSub: sum(now.sub), paidNon: sum(now.non), expSub: sum(expected) };
}
window._budget = null;

function renderDashboard(netBal, cashBal, cardBal){
  var b = window._budget = monthBudget();
  var html = '';
  // 1. Net balance
  html += '<div class="dash-net" onclick="showNetWorth()">'
    + '<div class="dash-net-label">Net balance</div>'
    + '<div class="dash-net-val">'+fmt(netBal)+'</div>'
    + '<div class="dash-net-sub"><span>Cash & investments '+fmt(cashBal)+'</span><span>Cards owed −'+fmt(cardBal)+'</span></div>'
    + '</div>';
  if(!b) return html;
  var mon = new Date(b.cur+'-15T00:00:00').toLocaleString('en-US',{month:'long'});
  var partial = b.m.days < b.m.days_in_month;

  // 2. This month vs 6-month average
  var bar = function(kind, title, paid, est, avg, tint, ink){
    var full = Math.max(avg, 1), pPaid = Math.min(100, paid/full*100), pEst = Math.min(100 - pPaid, est/full*100);
    var pct = Math.round((paid + est)/full*100);
    var over = paid + est > avg;
    return '<div class="dash-bar" style="background:'+tint+'" onclick="showBudget(\''+kind+'\')">'
      + '<div class="dash-bar-top"><div class="dash-bar-title">'+title+'</div>'
      + '<div class="dash-bar-pct" style="color:'+(over ? 'var(--red)' : 'var(--text)')+'">'+pct+'%</div></div>'
      + '<div class="dash-track"><div class="dash-fill" style="width:'+pPaid+'%;background:'+ink+'"></div>'
      + (pEst > 0 ? '<div class="dash-fill dash-est" style="width:'+pEst+'%;--ink:'+ink+'"></div>' : '')
      + '<div class="dash-track-text"><span class="dash-tt-l">'+fmt(paid)+' paid'+(est ? ' + ~'+fmt(est)+' due' : '')+'</span><span>of '+fmt(avg)+'</span></div></div>'
      + '</div>';
  };
  html += '<div class="dash-head"><span>'+mon+(partial ? ' · day '+b.m.days+' of '+b.m.days_in_month : '')+'</span><span>full bar = your usual month</span></div>';
  html += bar('sub', 'Subscriptions & recurring', b.paidSub, b.expSub, b.avg.sub, 'var(--p-lav)', '#b7abfb');
  html += bar('non', 'Everything else', b.paidNon, 0, b.avg.non, 'var(--p-peach)', '#f7bf98');

  // 3. Categories, biggest spend first
  if(b.cats.length){
    html += '<div class="panel dash-cats"><div class="panel-head"><div class="panel-title">Where it went · '+mon+'</div><div class="panel-action">vs usual</div></div>';
    b.cats.forEach(function(c, i){
      var col = DASH_COLORS[i % DASH_COLORS.length];
      var full = Math.max(c.avg, c.v, 1), w = c.v/full*100, mark = c.avg > 0 ? Math.min(100, c.avg/full*100) : -1;
      var catEsc = esc(c.g).replace(/\\/g,'\\\\').replace(/'/g,'\\\'');
      html += '<div class="dash-cat" onclick="showFlow(\''+b.cur+'\',\'out\',\''+catEsc+'\')">'
        + '<div class="dash-cat-row"><span class="dash-cat-name"><span class="dash-dot" style="background:'+col+'"></span>'+esc(c.g)+'</span>'
        + '<span class="dash-cat-amt">'+fmt(c.v)+(c.avg > 0 ? '<span class="dash-cat-avg"> / '+fmt(c.avg)+'</span>' : '<span class="dash-cat-avg"> new</span>')+'</span></div>'
        + '<div class="dash-cat-track"><div class="dash-cat-fill" style="width:'+w+'%;background:'+col+'"></div>'
        + (mark >= 0 ? '<div class="dash-cat-mark" style="left:'+mark+'%"></div>' : '') + '</div></div>';
    });
    html += '<div style="font-size:11px;color:var(--muted);margin-top:8px">The tick marks your 6-month average for that category. Tap a row to see its transactions.</div></div>';
  }
  return html;
}

// Popup for the two bars: what was paid (deletable) and what's still expected.
function showBudget(kind){
  var b = window._budget; if(!b) return;
  var paid = (kind === 'sub' ? b.now.sub : b.now.non).slice().sort(function(x,y){ return Math.abs(y.a) - Math.abs(x.a); });
  var mon = new Date(b.cur+'-15T00:00:00').toLocaleString('en-US',{month:'long', year:'numeric'});
  var row = flowRow;
  var total = paid.reduce(function(t,x){ return t + x.a; }, 0);
  var h = '<div class="dash-modal-sum"><div><div class="kpi-label">Paid so far</div><div class="kpi-val">'+fmt2(total)+'</div></div>';
  if(kind === 'sub') h += '<div><div class="kpi-label">Still expected</div><div class="kpi-val" style="color:var(--purple)">~'+fmt(b.expSub)+'</div></div>';
  h += '<div><div class="kpi-label">Usual month</div><div class="kpi-val" style="color:var(--muted)">'+fmt(kind === 'sub' ? b.avg.sub : b.avg.non)+'</div></div></div>';
  if(kind === 'sub' && b.expected.length){
    h += '<div class="srch-month">Still expected this month</div>';
    b.expected.forEach(function(e){
      h += '<div class="txn" style="opacity:.85"><div class="txn-date">~'+(b.cur.slice(5))+'-'+('0'+e.day).slice(-2)+'</div>'
        + '<div class="txn-main"><div class="txn-name">'+esc(e.key.replace(/\b\w/g,function(c){ return c.toUpperCase(); }))+'</div>'
        + '<div class="txn-meta">'+(e.late ? 'usually by the '+e.day+(e.day===1?'st':e.day===2?'nd':e.day===3?'rd':'th')+' — not seen yet' : 'estimate from past months')+'</div></div>'
        + '<div class="txn-amt" style="color:var(--purple)">~'+fmt2(e.a)+'</div></div>';
    });
  }
  h += '<div class="srch-month">Paid · '+paid.length+'</div>';
  h += paid.length ? paid.map(row).join('') : '<div style="color:var(--muted);font-size:13px;padding:8px 0">Nothing yet this month.</div>';
  h += '<div style="font-size:11px;color:var(--muted);margin-top:10px">'+(kind === 'sub'
    ? 'Recurring = charged in at least 3 of the last 6 months at a similar amount, plus home and car loans.'
    : 'Everything that isn’t recurring. Refunds show in green and reduce the total.')+'</div>';
  openModal(kind === 'sub' ? 'Subscriptions & recurring · '+mon : 'Everything else · '+mon, 'Paid so far'+(kind === 'sub' ? ' and still expected' : ''), h);
}

function renderOverview() {
  var ms = D.monthly_spending || {};
  var mh = D.monthly_history || [];
  var periods = Object.keys(ms).sort();
  var latest = periods[periods.length - 1] || '';
  var latestV = ms[latest] || {transactions:[], categories:{}, total:0, label:''};
  var nw = D.net_worth || {};
  var allAccts = dedupAccts(D.all_accounts);
  // Always compute from all_accounts — server value excludes wifebofa/myrobin
  var checkingBal = allAccts.filter(function(a){return !a.is_credit && a.type!=='loan';}).reduce(function(s,a){return s+a.balance;},0);
  var creditBal = allAccts.filter(function(a){return a.is_credit&&a.balance>0;}).reduce(function(s,a){return s+a.balance;},0);
  var loanBal = allAccts.filter(function(a){return a.type==='loan';}).reduce(function(s,a){return s+a.balance;},0);
  var netWorth = checkingBal - creditBal - loanBal + savingsTotal(); // assets − cards − loans + private savings

  // Connected banks strip — on top so missing banks are obvious
  var html = renderBanksStrip(allAccts);
  // Dashboard per the owner's design: net balance (cash & investments minus
  // card debt), this month vs usual, then categories. Net worth with the house,
  // loans and private savings is one tap away (showNetWorth).
  html += renderDashboard(checkingBal - creditBal, checkingBal, creditBal);

  // Text insights — what moved net worth, MoM + last 7 days
  html += renderInsights();

  // Chart data embedded in data attributes
  var chartLabels = JSON.stringify(periods.map(function(p){ return short(ms[p].label); }));
  var chartSpends = JSON.stringify(periods.map(function(p){ return ms[p].total || 0; }));
  var chartIncomes = JSON.stringify(periods.map(function(p){
    var entry = mh.find(function(m){ return m.period === p; });
    return entry ? Number(entry.income) || 0 : 0;
  }));
  html += '<div class="panel"><div class="panel-head"><div class="panel-title">Monthly Cash Flow</div><div class="panel-action">' + short(latestV.label) + '</div></div>';
  html += '<div class="chart-wrap"><canvas id="cfChart" data-l=\"' + encodeURIComponent(chartLabels) + '\" data-s=\"' + encodeURIComponent(chartSpends) + '\" data-i=\"' + encodeURIComponent(chartIncomes) + '\"></canvas></div></div>';

  // Pending transactions panel
  var pending = D.pending_transactions || [];
  if (pending.length) {
    html += '<div class="panel" style="border-color:rgba(245,197,24,0.3);background:rgba(245,197,24,0.04)">';
    html += '<div class="panel-head"><div class="panel-title" style="color:var(--yellow)">⏳ Pending · Not Yet Settled</div>';
    html += '<div class="panel-action" style="color:var(--yellow)">' + pending.length + ' transactions</div></div>';
    pending.forEach(function(t) {
      var col = CAT_COLORS[t.category] || '#6b6b80';
      var bankShort = {'BofA':'BOA','Wells Fargo':'WF','TD Bank':'TD','Discover':'DISC','Robinhood':'RH'}[t.bank] || (t.bank||'').substring(0,4).toUpperCase();
      html += '<div style="display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--border2);font-size:12px;opacity:0.8">';
      html += '<span style="font-family:IBM Plex Mono,monospace;color:var(--yellow);font-size:10px;width:40px;flex-shrink:0">PEND</span>';
      if(bankShort) html += '<span style="font-size:9px;font-family:IBM Plex Mono,monospace;color:var(--muted2);background:var(--s2);border-radius:3px;padding:1px 4px;flex-shrink:0">' + bankShort + '</span>';
      html += '<span style="flex:1;word-break:break-word;line-height:1.4;color:var(--muted)">' + t.desc + '</span>';
      html += '<span style="font-size:10px;color:'+col+';margin-right:6px">' + t.category + '</span>';
      html += '<span style="font-family:IBM Plex Mono,monospace;color:var(--yellow);white-space:nowrap">' + fmt2(t.amount) + '</span>';
      html += '</div>';
    });
    html += '<div style="font-size:10px;color:var(--muted);padding:6px 0 2px">These will appear in spending once settled (1-2 days)</div>';
    html += '</div>';
  }

  html += '<div class="two-col">';

  // Monthly Spend — table: categories=rows, months=cols, tap cell=modal
  var allCats2 = {};
  periods.forEach(function(p) {
    Object.keys(ms[p].categories||{}).forEach(function(cat){ allCats2[cat]=true; });
  });
  var catList = Object.keys(allCats2).sort(function(a,b){
    return periods.reduce(function(s,p){return s+(ms[p].categories[b]||0);},0)
         - periods.reduce(function(s,p){return s+(ms[p].categories[a]||0);},0);
  });
  var colPeriods = periods.slice().reverse();
  var grandTotal = periods.reduce(function(s,p){return s+(ms[p].total||0);},0);

  // Store txns for modal - keyed by index to avoid quote issues in onclick
  window._msTxns = {};
  var _txnStore = window._msTxns;

  html += '<div class="panel" style="overflow-x:auto">';
  html += '<div class="panel-head"><div class="panel-title">Monthly Spend</div>';
  html += '<div class="panel-action">'+fmt(grandTotal)+' total</div></div>';
  html += '<div style="font-size:10px;color:var(--muted);padding:0 0 6px">Tap any amount to see its transactions ↓</div>';
  html += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  html += '<thead><tr>';
  html += '<th style="text-align:left;padding:6px 8px;font-size:10px;color:var(--muted);border-bottom:2px solid var(--border);font-weight:500;min-width:90px">Category</th>';
  colPeriods.forEach(function(p){
    html += '<th style="text-align:right;padding:6px 8px;font-size:10px;color:var(--muted);border-bottom:2px solid var(--border);font-weight:500;white-space:nowrap">'+short(ms[p].label)+'</th>';
  });
  html += '<th style="text-align:right;padding:6px 8px;font-size:10px;color:var(--muted);border-bottom:2px solid var(--border);font-weight:500">Total</th>';
  html += '</tr></thead><tbody>';

  catList.forEach(function(cat, ci) {
    var col = CAT_COLORS[cat] || '#6b6b80';
    var catEsc = String(cat).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var rowTotal = periods.reduce(function(s,p){return s+(ms[p].categories[cat]||0);},0);
    if(!rowTotal) return;
    var allCatTxns = [];
    periods.forEach(function(p){
      (ms[p].transactions||[]).filter(function(t){return t.category===cat;}).forEach(function(t){ allCatTxns.push(t); });
    });
    allCatTxns.sort(function(a,b){return b.date.localeCompare(a.date);});
    _txnStore['r'+ci] = allCatTxns;

    html += '<tr style="border-bottom:1px solid var(--border2)">';
    html += '<td style="padding:7px 8px;font-weight:500;color:'+col+';cursor:pointer;white-space:nowrap" onclick="_showMs(\'r'+ci+'\',\''+col+'\',\''+catEsc+'\')">';
    html += '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+col+';margin-right:6px;vertical-align:middle"></span>'+cat+'</td>';

    colPeriods.forEach(function(p, pi) {
      var a = ms[p].categories[cat] || 0;
      if(a) {
        var key = 'r'+ci+'_'+pi;
        _txnStore[key] = (ms[p].transactions||[]).filter(function(t){return t.category===cat;});
        var lbl = cat+' '+short(ms[p].label);
        var lblEsc = lbl.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        html += '<td style="padding:7px 8px;text-align:right;font-family:IBM Plex Mono,monospace;color:'+col+';cursor:pointer;white-space:nowrap;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:'+col+'88;text-underline-offset:3px" onclick="_showMs(\''+key+'\',\''+col+'\',\''+lblEsc+'\')">' + fmt(a) + '</td>';
      } else {
        html += '<td style="padding:7px 8px;text-align:right;color:var(--muted2)">—</td>';
      }
    });
    html += '<td style="padding:7px 8px;text-align:right;font-family:IBM Plex Mono,monospace;font-weight:600;color:'+col+'">'+fmt(rowTotal)+'</td>';
    html += '</tr>';
  });

  html += '<tr style="background:var(--s2);border-top:2px solid var(--border)">';
  html += '<td style="padding:7px 8px;font-weight:600;font-size:11px;color:var(--muted)">Total</td>';
  colPeriods.forEach(function(p){
    html += '<td style="padding:7px 8px;text-align:right;font-family:IBM Plex Mono,monospace;font-weight:600">'+fmt(ms[p].total||0)+'</td>';
  });
  html += '<td style="padding:7px 8px;text-align:right;font-family:IBM Plex Mono,monospace;font-weight:700">'+fmt(grandTotal)+'</td>';
  html += '</tr></tbody></table></div>';

  // Recent transactions
  var allTxns = [];
  periods.slice().reverse().forEach(function(p){ (ms[p].transactions||[]).forEach(function(t){ allTxns.push({period:p,t:t}); }); });
  allTxns.sort(function(a,b){ return (b.period+b.t.date).localeCompare(a.period+a.t.date); });
  html += '<div class="panel"><div class="panel-head"><div class="panel-title">Recent Transactions</div></div>';
  allTxns.slice(0,10).forEach(function(item) {
    var t = item.t;
    var col = CAT_COLORS[t.category] || '#6b6b80';
    html += txnLine(t, col, '');
  });
  html += '</div>';
  html += '</div>';

  set('main-content', html);

  setTimeout(function() {
    var ctx = $('cfChart');
    if(!ctx) return;
    if(_chartInst) { _chartInst.destroy(); _chartInst = null; }
    var labels = JSON.parse(decodeURIComponent(ctx.getAttribute('data-l') || '%5B%5D'));
    var spends = JSON.parse(decodeURIComponent(ctx.getAttribute('data-s') || '%5B%5D'));
    var incomes = JSON.parse(decodeURIComponent(ctx.getAttribute('data-i') || '%5B%5D'));
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var gridCol = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';

    var datasets = [
      {label:'Spending', data:spends, borderColor:'#ff4060', backgroundColor:'rgba(255,64,96,0.08)', tension:.35, pointRadius:5, fill:true, borderWidth:2}
    ];
    var hasIncome = incomes.some(function(v){ return v > 0; });
    if(hasIncome) {
      datasets.push({label:'Income', data:incomes, borderColor:'#00d084', backgroundColor:'rgba(0,208,132,0.08)', tension:.35, pointRadius:5, fill:true, borderWidth:2});
    }
    _chartInst = new Chart(ctx, {
      type: 'line',
      data: {labels: labels, datasets: datasets},
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: {position:'top', labels:{font:{family:'IBM Plex Mono',size:11}, color:textCol, boxWidth:12, padding:16}},
          tooltip: {callbacks:{label:function(c){return ' '+c.dataset.label+': '+fmt2(c.raw);}}}
        },
        scales: {
          x: {grid:{color:gridCol}, ticks:{font:{family:'IBM Plex Mono',size:11}, color:textCol}},

function acctLine(a) {
  var owed = (a.is_credit || a.type === 'loan') && a.balance > 0;
  var col = owed ? 'var(--red)' : 'var(--green)';
  var sign = owed ? '-' : '';

  return '<div style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border2);font-size:13px"><div><div>' + name + ' <span style="font-family:IBM Plex Mono,monospace;color:var(--muted)">xx' + a.mask + '</span></div><div style="font-size:11px;color:var(--muted)">' + a.bank + ' ' + a.subtype + '</div></div><div style="font-family:IBM Plex Mono,monospace;font-weight:500;color:' + col + '">' + sign + fmt2(Math.abs(a.balance)) + '</div></div>';
}

  var rows=[], row=[], cur='', q=false;

// ── Why did spending move? ──
// Compares one month's spending with the month before, category by category,

// previous 6 months), more orders/visits, or a bill that hasn't come yet.
// A month still in progress is compared with the same days of last month.
var FREQ_GROUPS = { 'Amazon':'orders', 'Shopping':'orders', 'Restaurants':'visits', 'Groceries':'trips', 'Food delivery':'orders', 'Gas/Travel':'fill-ups', 'Entertainment':'charges', 'Zelle to people':'payments', 'Sent to India':'transfers' };
function explainMonth(p){
  var cf = D.cashflow || {}, keys = Object.keys(cf).sort(), i = keys.indexOf(p);

  var sum = function(l){ return l.reduce(function(t,x){ return t + x.a; }, 0); };
  var byCat = function(l){ var o = {}; l.forEach(function(x){ (o[x.g] = o[x.g] || []).push(x); }); return o; };
  var cc = byCat(cur), pc = byCat(prev);
  var total = sum(cur), prevTotal = sum(prev), delta = total - prevTotal;
  var floor = Math.max(100, Math.abs(prevTotal) * 0.03);
  var reasons = [];
  Object.keys(Object.assign({}, cc, pc)).forEach(function(g){
    var a = cc[g] || [], b = pc[g] || [], d = sum(a) - sum(b);
    if(Math.abs(d) < floor) return;
    // The merchant that moved most in the same direction.
    var mk = {};
    a.forEach(function(x){ var k = merchKey(x); mk[k] = mk[k] || {c:0,p:0,cn:0,pn:0,name:x.n}; mk[k].c += x.a; mk[k].cn++; });
    b.forEach(function(x){ var k = merchKey(x); mk[k] = mk[k] || {c:0,p:0,cn:0,pn:0,name:x.n}; mk[k].p += x.a; mk[k].pn++; });
    var top = null, topK = '';
    Object.keys(mk).forEach(function(k){ var v = mk[k], md = v.c - v.p; if(md * d > 0 && (!top || Math.abs(md) > Math.abs(top.c - top.p))){ top = v; topK = k; } });
    var why = '';
    if(top){
      var nm = niceName(top.name), md = top.c - top.p;
      if(d > 0 && !top.pn && !seen[topK] && top.c >= 250) why = nm+' '+fmt(top.c)+(later[topK] ? ' · new, keeps coming' : ' · one-off');
      else if(d > 0 && !top.pn) why = nm+' '+fmt(top.c)+(top.cn > 1 ? ' ('+top.cn+'×)' : '');
      else if(d < 0 && !top.cn) why = partial && g === 'Home & car loans' ? nm+' not paid yet' : 'no '+nm+' this month';
      else if(FREQ_GROUPS[g] && Math.abs(a.length - b.length) >= 3 && Math.abs(md) < Math.abs(d) * 0.6) why = a.length+' '+FREQ_GROUPS[g]+' vs '+b.length+(Math.abs(md) >= 100 ? ' · '+nm+' '+(md > 0 ? '+' : '−')+fmtK(Math.abs(md)) : '');
      else why = nm+' '+(md > 0 ? '+' : '−')+fmt(Math.abs(md));
      if(Math.abs(md) < Math.abs(d) * 0.4 && FREQ_GROUPS[g] && a.length !== b.length) why = a.length+' '+FREQ_GROUPS[g]+' vs '+b.length+(Math.abs(md) >= 100 ? ' · '+nm+' '+(md > 0 ? '+' : '−')+fmtK(Math.abs(md)) : '');
    }
    if(g === 'Bank & card fees' && d > 0) why = (why ? why+' · ' : '')+'avoidable';
    reasons.push({ g:g, d:d, why:why });
  });
  // Lead with what pushed the total the way it went, then the biggest counter-move.
  reasons.sort(function(x,y){ return Math.abs(y.d) - Math.abs(x.d); });
  var same = reasons.filter(function(r){ return r.d * delta > 0; }).slice(0, 3);
  var other = reasons.filter(function(r){ return r.d * delta <= 0; }).slice(0, same.length < 3 ? 1 : 0);
  return { p:p, pp:pp, total:total, prevTotal:prevTotal, delta:delta, partial:partial, days:m.days, reasons: same.concat(other) };
}

function renderSpendTimeline(){

  var html = '<div class="panel"><div class="panel-head"><div class="panel-title">Spending timeline</div><div class="panel-action">last 6 months · tap a month</div></div>';
  html += '<div class="tl-wrap" id="tl-wrap"><div class="tl">';
  keys.forEach(function(p, i){
    var e = explainMonth(p);
    var total = (cf[p].tx_out||[]).reduce(function(t,x){ return t + x.a; }, 0);
    var col = DASH_COLORS[i % DASH_COLORS.length];
    var partial = cf[p].days < cf[p].days_in_month;
    html += '<div class="tl-col">';
    html += '<div class="tl-mon"><span class="tl-dot" style="background:'+col+'"></span>'+monShort(p)+(partial ? ' · so far' : '')+'</div>';

    html += '<div class="tl-sq" style="--c:'+col+'" onclick="showFlow(\''+p+'\',\'out\')">'
      + '<div class="tl-sq-fill" style="height:'+Math.max(6, total/max*100)+'%"></div>'
      + '<div class="tl-sq-val">'+fmtK(total)+'</div>';
    if(e){
      var up = e.delta > 0, pct = e.prevTotal > 0 ? Math.round(Math.abs(e.delta)/e.prevTotal*100) : 0;
      html += '<div class="tl-sq-chg" style="color:'+(up ? 'var(--red)' : 'var(--green)')+'">'+(up ? '▲ ' : '▼ ')+fmtK(Math.abs(e.delta))+(pct ? ' · '+pct+'%' : '')+'</div>'
        + '<div class="tl-sq-vs">vs '+monShort(e.pp)+(e.partial ? ' 1–'+e.days : '')+'</div>';
    }
    html += '</div>';
    if(e && e.reasons.length){
      html += '<div class="tl-string"></div><div class="tl-note">';
      e.reasons.forEach(function(r){

          + '<div class="tl-why-top"><span>'+esc(r.g)+'</span><b style="color:'+(r.d > 0 ? 'var(--red)' : 'var(--green)')+'">'+(r.d > 0 ? '+' : '−')+fmtK(Math.abs(r.d))+'</b></div>'
          + (r.why ? '<div class="tl-why-sub">'+esc(r.why)+'</div>' : '') + '</div>';
      });
      html += '</div>';
    } else if(e){
      html += '<div class="tl-string"></div><div class="tl-note"><div class="tl-why-sub">Steady — no category moved much.</div></div>';
    }
    html += '</div>';
  });
  html += '</div></div>';
  html += '<div style="font-size:11px;color:var(--muted);margin-top:8px">Spending leaves out card payments and moves between your own accounts. Tap a box for every transaction, or a reason for that category.</div></div>';
  return html;
}

// ── Per bank: money in vs money out, last 4 months (rolls over monthly) ──
// Each bank's accounts and cards together. "In" is income landing in its
// checking/savings; "Out" is spending on its cards plus spending straight
// from its checking (loans, Zelle, debit). Card payments and transfers
// between our own accounts are already left out by buildCashflow.
function bankFlows(groups){
  var cf = D.cashflow || {}, months = Object.keys(cf).sort().slice(-4);
  var gOfMask = {};
  groups.forEach(function(g, gi){ g.accts.forEach(function(a){ gOfMask[a.mask] = { gi:gi, credit: !!a.is_credit }; }); });
  groups.forEach(function(g){ g.months = months.map(function(p){ return { p:p, inn:[], card:[], chk:[] }; }); });
  months.forEach(function(p, mi){
    (cf[p].tx_in||[]).forEach(function(x){ var o = gOfMask[x.k]; if(o) groups[o.gi].months[mi].inn.push(x); });
    (cf[p].tx_out||[]).forEach(function(x){ var o = gOfMask[x.k]; if(o) groups[o.gi].months[mi][o.credit ? 'card' : 'chk'].push(x); });
  });
  return months;
}
function showBankFlow(gi, mi, kind){
  var g = window._bankTL && window._bankTL[gi]; if(!g) return;
  var c = g.months[mi], mon = new Date(c.p+'-15T00:00:00').toLocaleString('en-US',{month:'long', year:'numeric'});
  var lists = kind === 'in' ? [['Money in', c.inn]] : [['On cards', c.card], ['From checking', c.chk]];
  var h = '';
  lists.forEach(function(l){
    if(!l[1].length) return;
    var t = l[1].reduce(function(s,x){ return s + x.a; }, 0);
    h += '<div class="srch-month">'+l[0]+' · '+fmt2(t)+'</div>';
    h += l[1].slice().sort(function(a,b){ return Math.abs(b.a) - Math.abs(a.a); }).map(flowRow).join('');
  });
  openModal(g.label+' · '+(kind === 'in' ? 'money in' : 'money out'), mon, h || '<div style="color:var(--muted);font-size:13px">Nothing this month.</div>');
}

function renderAccounts() {
  var allAccts = dedupAccts(D.all_accounts);
  var ms = D.monthly_spending || {};
  var last2 = Object.keys(ms).sort().reverse().slice(0,2);
  var ALIAS = {'wifebofa':'BofA','myrobin':'Robinhood','bofa':'BofA','bofa_2':'BofA'};
  function normBank(b){ return ALIAS[b||''] || b || ''; }
  // Transactions for ONE account: joined on mask, and the bank must match so a
  // coincidental same last-4 on another bank can't bleed in.
  function monthTxnsForAccount(p, acct) {
    var all = ms[p] ? ms[p].transactions||[] : [];
    return all.filter(function(t){ return String(t.mask)===String(acct.mask) && (t.bank==null || normBank(t.bank)===normBank(acct.bank)); });
  }
  // Loans and cards are money owed: always shown negative, in red.
  function acctRow(a) {
    var owed = (a.is_credit || a.type === 'loan') && a.balance > 0;
    var name = a.name.replace(/\s*\.\.\.\d{4}/g,'').replace(/[^\x20-\x7E]+/g,'').trim();
    var cid = uid();
    var h = '<div><div class="acct-row" onclick="expand(\''+cid+'\')">'
      + '<div><div>'+esc(name)+' <span style="color:var(--muted);font-size:11px">••'+esc(a.mask)+'</span></div>'
      + '<div style="font-size:11px;color:var(--muted)">'+esc(a.subtype)+'</div></div>'
      + '<div style="display:flex;align-items:center;gap:8px"><div style="font-weight:700;color:'+(owed?'var(--red)':'var(--green)')+'">'+(owed?'−':'')+fmt2(Math.abs(a.balance))+'</div><span style="color:var(--muted);font-size:11px">›</span></div></div>';
    h += '<div id="'+cid+'" class="expand-body">';
    var had = false;
    last2.forEach(function(p){
      var t = monthTxnsForAccount(p, a); if(!t.length) return; had = true;
      h += '<div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);padding:5px 14px 2px;background:var(--s2)">'+ms[p].label+'</div>';
      t.sort(function(x,y){ return y.date.localeCompare(x.date); }).forEach(function(x){ h += txnLine(x, CAT_COLORS[x.category]||'#6b6b80', 'padding-left:14px;'); });
    });
    if(!had) h += '<div style="padding:8px 14px;font-size:12px;color:var(--muted)">No transactions in last 2 months</div>';
    return h + '</div></div>';
  }

  var html = renderSpendTimeline();

  // ── BANKS & CARDS: each bank's accounts and cards together ──
  var byKey = {}, groups = [];
  allAccts.filter(function(a){ return a.type !== 'loan'; }).forEach(function(a){
    var k = bankKeyOf(a);
    if(!byKey[k]){ byKey[k] = { key:k, label: bankLabelOf(k, a.bank), accts:[] }; groups.push(byKey[k]); }
    byKey[k].accts.push(a);
  });
  groups.forEach(function(g){
    g.cash = g.accts.filter(function(a){ return !a.is_credit; }).reduce(function(s,a){ return s + a.balance; }, 0);
    g.owed = g.accts.filter(function(a){ return a.is_credit && a.balance > 0; }).reduce(function(s,a){ return s + a.balance; }, 0);
  });
  groups.sort(function(a,b){ return (b.cash - b.owed) - (a.cash - a.owed); });
  var months = bankFlows(groups);
  window._bankTL = groups;
  var cashT = groups.reduce(function(s,g){ return s + g.cash; }, 0), owedT = groups.reduce(function(s,g){ return s + g.owed; }, 0);

  html += '<div class="panel"><div class="panel-head"><div class="panel-title">Banks & cards</div>'
    + '<div class="panel-action"><span style="color:var(--green)">'+fmt(cashT)+'</span> · <span style="color:var(--red)">−'+fmt(owedT)+' cards</span></div></div>';
  html += '<div style="font-size:11px;color:var(--muted);margin:-4px 0 10px">Each month: income landing in the bank vs spending on its cards and straight from its checking. Last 4 months — tap to see transactions.</div>';
  groups.forEach(function(g, gi){
    var bid = uid();
    html += '<div class="bank-card">';
    html += '<div class="bank-card-head" onclick="expand(\''+bid+'\')"><div><div class="bank-card-name">'+esc(g.label)+'</div>'
      + '<div class="row-sub">'+g.accts.length+' account'+(g.accts.length>1?'s':'')+' · tap for balances</div></div>'
      + '<div style="text-align:right"><div style="font-weight:800;color:var(--green)">'+fmt2(g.cash)+'</div>'
      + (g.owed > 0 ? '<div style="font-size:12px;font-weight:700;color:var(--red)">−'+fmt2(g.owed)+' cards</div>' : '') + '</div></div>';
    html += '<div id="'+bid+'" class="expand-body">';
    g.accts.slice().sort(function(a,b){ return (a.is_credit?1:0) - (b.is_credit?1:0); }).forEach(function(a){ html += acctRow(a); });
    html += '</div>';
    var sums = g.months.map(function(c){
      var s = function(l){ return l.reduce(function(t,x){ return t + x.a; }, 0); };
      return { inn: s(c.inn), card: s(c.card), chk: s(c.chk) };
    });
    var mx = Math.max.apply(null, sums.map(function(s){ return Math.max(s.inn, s.card + s.chk); }).concat([1]));
    html += '<div class="bank-tl">';
    sums.forEach(function(s, mi){
      var out = s.card + s.chk, net = s.inn - out;
      var partial = D.cashflow[months[mi]].days < D.cashflow[months[mi]].days_in_month;
      html += '<div class="bank-tl-col">'
        + '<div class="bank-tl-mon">'+monShort(months[mi])+(partial ? '*' : '')+'</div>'
        + '<div class="bank-tl-cell" onclick="showBankFlow('+gi+','+mi+',\'in\')">'
        +   '<div class="bank-tl-bar"><div style="width:'+(Math.max(0,s.inn)/mx*100)+'%;background:#86d3b5"></div></div>'
        +   '<div class="bank-tl-lbl">In</div><div class="bank-tl-amt" style="color:var(--green)">+'+fmtK(s.inn)+'</div></div>'
        + '<div class="bank-tl-cell" onclick="showBankFlow('+gi+','+mi+',\'out\')">'
        +   '<div class="bank-tl-bar"><div style="width:'+(Math.max(0,s.card)/mx*100)+'%;background:#f5a9bf"></div><div style="width:'+(Math.max(0,s.chk)/mx*100)+'%;background:#f3c58b"></div></div>'
        +   '<div class="bank-tl-lbl">Out</div><div class="bank-tl-amt" style="color:var(--red)">−'+fmtK(out)+'</div>'
        +   (s.card > 0.5 && s.chk > 0.5 ? '<div class="bank-tl-split">cards '+fmtK(s.card)+' · chk '+fmtK(s.chk)+'</div>' : (s.card > 0.5 ? '<div class="bank-tl-split">on cards</div>' : (s.chk > 0.5 ? '<div class="bank-tl-split">from checking</div>' : '')))
        + '</div>'
        + '<div class="bank-tl-net" style="color:'+(net >= 0 ? 'var(--green)' : 'var(--red)')+'">net '+(net >= 0 ? '+' : '')+fmtK(net)+'</div>'
        + '</div>';
    });
    html += '</div></div>';
  });
  html += '<div style="font-size:10.5px;color:var(--muted);margin-top:6px"><span style="color:#e98aa6">■</span> on cards &nbsp;<span style="color:#e0a85e">■</span> from checking &nbsp;· * month in progress</div>';
  html += '</div>';

  // ── LOANS: owed, so negative ──
  var loans = allAccts.filter(function(a){ return a.type === 'loan'; });
  if(loans.length){
    var loanT = loans.reduce(function(s,a){ return s + Math.max(0, a.balance); }, 0);
    html += '<div class="panel"><div class="panel-head"><div class="panel-title">Loans</div><div class="panel-action" style="color:var(--red)">−'+fmt2(loanT)+'</div></div>';
    loans.forEach(function(a){
      var lbl = bankLabelOf(bankKeyOf(a), a.bank);
      html += '<div class="acct-row" style="cursor:default"><div><div>'+esc(lbl)+' <span style="color:var(--muted);font-size:11px">••'+esc(a.mask)+'</span></div>'
        + '<div style="font-size:11px;color:var(--muted)">'+esc(a.subtype)+' · owed</div></div>'
        + '<div style="font-weight:700;color:var(--red)">−'+fmt2(Math.abs(a.balance))+'</div></div>';
    });
    html += '</div>';
  }

  set('main-content', html);
  setTimeout(function(){ var w = $('tl-wrap'); if(w) w.scrollLeft = w.scrollWidth; }, 30);
}

function cleanZelleName(raw){
  if(!raw) return '';
  function title(x){ return x.trim().toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();}); }
  // Pattern 1: BofA — "payment from NAME for..." or "payment from NAME Conf#..."
  var m=raw.match(/payment from ([A-Z][A-Za-z\s]+?)(?:\s+for\s+|\s+Conf#|;)/i);
  if(m) return title(m[1]);
  // Pattern 2: Wells Fargo — "FROM NAME ON 10/26 REF # <ref> <memo>", plus
  // the older bare "FROM NAME". The backend strips the word "Zelle" out of
  // the name before storing it, so Pattern 3 can never fire on a WF row; and
  // without a stop at " ON <date>" or " REF #" these fell through to the
  // 30-character fallback below, which kept the date and reference number in
  // the label. One sender then became a separate row per payment, which is
  // why the table looked far emptier than the data actually was.
  m=raw.match(/^FROM\s+([A-Z][A-Za-z.'\-\s]*?)\s*(?:\s+ON\s+\d{1,2}\/\d{1,2}\b|\s+REF\s*#|\s+Conf#|\s*$)/i);
  if(m && m[1].trim().length>2) return title(m[1]);
  // Pattern 3: TD — "TD RECEIVED <ref> Zelle NAME"
  m=raw.match(/Zelle ([A-Z][A-Z\s]{3,30})/i);
  if(m) return title(m[1]);
  // Pattern 4: plain "payment from NAME"
  m=raw.match(/payment from ([A-Z][A-Za-z\s]{3,40})/i);
  if(m) return title(m[1]);
  return raw.substring(0,30);
}
